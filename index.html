          const ln = Math.hypot(dx, dy) || 1;
          const tick = spacing * (0.42 + hash(g.seed + ":tl:" + s) * 0.28);
          const ox = dx / ln;
          const oy = dy / ln;
          const inset = spacing * 0.12;
          brush.line(p[0] + ox * inset, p[1] + oy * inset, p[0] + ox * (inset + tick), p[1] + oy * (inset + tick));
          if (hash(g.seed + ":stip:" + k + ":" + s) < 0.18) {
            const sx = p[0] + ox * spacing * 0.45 + (hash(g.seed + ":sx:" + s) - 0.5) * 2.4;
            const sy = p[1] + oy * spacing * 0.45 + (hash(g.seed + ":sy:" + s) - 0.5) * 2.4;
            brush.line(sx, sy, sx + 0.8, sy + 0.6);
          }
        }
      }
      brush.noField();
      resetBrush();
    }

    function drawPlantGesture(g) {
      const clumps = g.clumps;
      if (!clumps || !clumps.length) return;
      for (let pass = 0; pass < 2; pass++) {
        resetBrush();
        brush.mass(B.crayon, pal("olive"), {
          precision: random(0.52, 0.68),
          strength: random(0.74, 0.95),
          gradient: 0.2,
          outline: false
        });
        for (let i = 0; i < clumps.length; i++) {
          const c = clumps[i];
          brush.circle(c.x + random(-0.9, 0.9), c.y + random(-0.9, 0.9), c.r * (pass ? 0.84 : 1), 0.52);
        }
      }

      resetBrush();
      brush.mass(B.pastel, hash(g.seed + ":tone") > 0.45 ? pal("sap") : pal("sapDeep"), {
        precision: random(0.42, 0.54),
        strength: random(0.5, 0.82),
        gradient: 0.18,
        outline: false
      });
      for (let i = 0; i < clumps.length; i++) {
        const c = clumps[i];
        brush.circle(c.x + c.r * 0.14, c.y - c.r * 0.1, c.r * random(0.52, 0.78), 0.5);
      }

      resetBrush();
      analogTooth();
      brush.set(B.charcoal, pal("sapDeep"), 0.26);
      for (let i = 0; i < clumps.length; i++) {
        const c = clumps[i];
        // Outlining every clump reads as a chain of empty rings, not foliage.
        if (!c.tree && hash(g.seed + ":ol:" + i) > 0.5) continue;
        brush.circle(c.x, c.y, c.r * (c.tree ? 1.02 : 0.98), 0.5);
      }
      brush.noField();
      resetBrush();
    }

    function drawTreeGesture(g) {
      resetBrush();
      const tx = g.x + random(-4, 4);
      const ty = g.y + random(-4, 4);
      const r = g.r * random(0.96, 1.05);

      resetBrush();
      const shadowCol = hash(g.seed + ":shade") > 0.5 ? pal("terracotta") : pal("ink");
      brush.fill(shadowCol, random(62, 86));
      brush.fillBleed(0.02, "out");
      brush.polygon(ellipsePts(tx + r * 0.12, ty + r * 0.62, r * 0.9, r * 0.22, 10));
      brush.noFill();

      resetBrush();
      brush.mass(B.crayon, pal("sapDeep"), {
        precision: 0.46,
        strength: 0.66,
        gradient: 0.26,
        outline: false
      });
      brush.circle(tx, ty, r, 0.55);

      resetBrush();
      brush.mass(B.pastel, pal("olive"), {
        precision: 0.48,
        strength: 0.7,
        gradient: 0.24,
        outline: false
      });
      brush.circle(tx + r * 0.16, ty - r * 0.12, r * 0.7, 0.58);
      brush.circle(tx - r * 0.14, ty + r * 0.1, r * 0.58, 0.5);

      resetBrush();
      analogTooth();
      brush.set(B.charcoal, pal("sapDeep"), 0.42);
      shape(lobedCircle(tx, ty, r * 0.97, 7 + Math.round(hash(g.seed + ":lobes") * 4),
        0.055, g.seed), true, 0.22);
      brush.noField();

      // Trunk mark at the centre — the convention that separates a specimen
      // tree from a mass of shrubs, and gives the canopy a centre to read from
      resetBrush();
      brush.fill(lotBackdropColor(), 232);
      brush.fillBleed(0);
      brush.polygon(ellipsePts(tx, ty, r * 0.19, r * 0.19, 14));
      brush.noFill();

      resetBrush();
      analogTooth();
      brush.set(B.rotring, pal("ink"), 0.5);
      brush.circle(tx, ty, r * 0.19, 0.5);
      brush.noField();

      resetBrush();
      brush.fill(pal("ink"), 215);
      brush.fillBleed(0);
      brush.polygon(ellipsePts(tx, ty, r * 0.075, r * 0.075, 10));
      brush.noFill();
      resetBrush();
    }

    function drawPathGesture(g) {
      if (!g.pts || g.pts.length < 2) return;
      resetBrush();
      // Keep finished path silk-smooth; light analog only
      const pts = analogize(g.pts, 0.4, 1, false);
      const minS = Math.min(width, height);
      const halfW = g.halfW != null ? g.halfW : minS * 0.018;
      const left = offsetEdge(pts, halfW);
      const right = offsetEdge(pts, -halfW);
      const rib = ribbon(pts, halfW);

      resetBrush();
      const fillCol = hash(g.seed + ":mat") > 0.28 ? pal("terracotta") : pal("pave");
      forOpenRibbonQuads(pts, halfW, function (q) {
        brush.fill(fillCol, random(96, 128));
        brush.fillBleed(0);
        brush.fillTexture(0.5, 0.45);
        brush.polygon(q);
        resetBrush();
        brush.noFill();
        brush.noHatch();
      });

      resetBrush();
      analogTooth();
      brush.set(B.charcoal, pal("ink"), 0.58);
      shape(chaikin(jitter(left, 0.35), 2, false), false, 0.22);
      brush.set(B.charcoal, pal("ink"), 0.54);
      shape(chaikin(jitter(right, 0.35), 2, false), false, 0.22);
      brush.set(B.rotring, pal("ink"), 0.3);
      shape(chaikin(jitter(left, 0.25), 1, false), false, 0.14);
      brush.set(B.rotring, pal("ink"), 0.28);
      shape(chaikin(jitter(right, 0.25), 1, false), false, 0.14);

      analogTooth();
      brush.set(B.HB, pal("ink"), 0.44);
      brush.noField();
      const joints = g.joints && g.joints.length ? g.joints : resample(pts, halfW * 2.6, false);
      const tickLen = halfW * 0.55;
      function ticksAt(p, heading) {
        const nx = -sin(heading);
        const ny = cos(heading);
        const lx = p[0] + nx * halfW;
        const ly = p[1] + ny * halfW;
        const rx = p[0] - nx * halfW;
        const ry = p[1] - ny * halfW;
        brush.line(lx - nx * tickLen * 0.15, ly - ny * tickLen * 0.15, lx + nx * tickLen * 0.55, ly + ny * tickLen * 0.55);
        brush.line(rx + nx * tickLen * 0.15, ry + ny * tickLen * 0.15, rx - nx * tickLen * 0.55, ry - ny * tickLen * 0.55);
      }
      for (let i = 1; i < joints.length - 1; i++) {
        const j = joints[i];
        const prev = joints[i - 1];
        const next = joints[Math.min(joints.length - 1, i + 1)];
        const a1 = atan2(j[1] - prev[1], j[0] - prev[0]);
        const a2 = atan2(next[1] - j[1], next[0] - j[0]);
        let turn = a2 - a1;
        while (turn > 180) turn -= 360;
        while (turn < -180) turn += 360;
        // At an elbow the joint ticks from both legs land on top of each other.
        if (Math.abs(turn) > 30) continue;
        ticksAt(j, atan2(next[1] - prev[1], next[0] - prev[0]));
      }
      analogTooth();
      brush.set(B.charcoal, pal("ink"), 0.52);
      function endCap(idx) {
        const p = pts[idx];
        const heading = headingAt(pts, idx, false);
        const nx = -sin(heading);
        const ny = cos(heading);
        const cap = halfW * 1.05;
        brush.line(p[0] + nx * cap, p[1] + ny * cap, p[0] - nx * cap, p[1] - ny * cap);
      }
      endCap(0);
      endCap(pts.length - 1);

      brush.noField();
      resetBrush();
    }

    function drawWaterGesture(g) {
      if (!g.pts || g.pts.length < 3) return;
      resetBrush();
      let outline;
      if (g.boxy) {
        outline = jitter(g.pts, 1.35);
      } else {
        outline = analogize(g.pts, 1.15, 1, true);
      }

      resetBrush();
      brush.fill(pal("water"), random(128, 158));
      brush.fillBleed(0.04, "out");
      brush.fillTexture(0.5, 0.45);
      brush.polygon(outline);
      brush.noFill();

      resetBrush();
      analogTooth();
      brush.set(B.charcoal, pal("waterDeep"), 0.72);
      shape(outline, true, g.boxy ? 0.04 : 0.42);
      brush.set(B.pen, pal("water"), 0.4);
      shape(jitter(outline, 0.9), true, g.boxy ? 0.04 : 0.4);

      // Water is read by lines that follow the shore, densest at the edge.
      // A straight ruled hatch across the basin read as a glazed panel.
      // Insets scale with the basin, not the sheet: a fixed inset either hid
      // the first ring under the shoreline stroke on a small pool or left a
      // large one ringed only at its rim. Start clear of the rim, stop before
      // the middle so the centre stays open water.
      const bb = bboxOf(outline);
      const span = Math.max(28, Math.min(bb.w, bb.h));
      const step = Math.max(8, Math.min(24, span * 0.07));
      const fade = [0.5, 0.32, 0.2];
      let inset = Math.max(9, Math.min(22, span * 0.075)) * random(0.9, 1.15);
      for (let ring = 0; ring < 3; ring++) {
        if (inset > span * 0.34) break;
        const loop = insetClosed(outline, inset);
        if (!loop || loop.length < 6) break;
        analogTooth();
        brush.set(ring === 0 ? B.H2 : B.rotring,
          ring === 0 ? pal("waterDeep") : pal("water"),
          fade[ring] * random(0.9, 1.12));
        dashPath(jitter(loop.concat([loop[0]]), 0.6),
          random(7, 11) + ring * 4, random(5, 8) + ring * 4);
        inset += step * (1 + ring * 0.8);
      }

      brush.noField();
      resetBrush();
    }

    function drawRillGesture(g) {
      if (!g.pts || g.pts.length < 2) return;
      resetBrush();
      const pts = analogize(g.pts, 0.9, 1, false);
      const minS = Math.min(width, height);
      const halfW = g.halfW != null ? g.halfW : minS * 0.022;
      const left = offsetEdge(pts, halfW);
      const right = offsetEdge(pts, -halfW);
      const flow = headingOf(pts);

      // The channel body is a stroked polyline, not a filled ribbon. A ribbon
      // polygon self-intersects on any S-bend — the fill then bloomed a wash
      // off to one side and shoved the deep water onto the inside of the
      // curves. Per-segment quads avoid that but seam into a boardwalk. A
      // round-joined stroke is a constant-width channel at any curvature.
      push();
      noFill();
      strokeJoin(ROUND);
      strokeCap(ROUND);
      const bodyCol = color(pal("water"));
      bodyCol.setAlpha(132);
      stroke(bodyCol);
      strokeWeight(halfW * 2);
      beginShape();
      for (let i = 0; i < pts.length; i++) vertex(pts[i][0], pts[i][1]);
      endShape();
      const deepCol = color(pal("waterDeep"));
      deepCol.setAlpha(72);
      stroke(deepCol);
      strokeWeight(halfW * 0.9);
      beginShape();
      for (let i = 0; i < pts.length; i++) vertex(pts[i][0], pts[i][1]);
      endShape();
      pop();
      resetBrush();

      // Banks are continuous — dashed edges plus cross ticks made the rill
      // read as paving. Flow is carried by sparse downstream chevrons.
      analogTooth();
      if (left && left.length >= 2) {
        brush.set(B.HB, pal("waterDeep"), random(0.5, 0.6));
        shape(left, false, 0.16);
      }
      analogTooth();
      if (right && right.length >= 2) {
        brush.set(B.HB, pal("waterDeep"), random(0.48, 0.58));
        shape(right, false, 0.16);
      }

      analogTooth();
      brush.set(B.HB, pal("waterDeep"), random(0.62, 0.78));
      brush.noField();
      // Sparse enough to read as flow marks; at a joint-like cadence they
      // turn the channel back into a paved walk.
      const flowGap = Math.max(130, halfW * 11);
      let acc = flowGap * 0.5;
      for (let i = 1; i < pts.length; i++) {
        const d = dist(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
        acc += d;
        if (acc < flowGap) continue;
        acc = 0;
        const x = pts[i][0];
        const y = pts[i][1];
        const heading = atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]);
        const arm = halfW * 0.72;
        // Chevron opening upstream, apex pointing the way the water runs
        brush.line(x, y, x - cos(heading + 34) * arm, y - sin(heading + 34) * arm);
        brush.line(x, y, x - cos(heading - 34) * arm, y - sin(heading - 34) * arm);
      }
      brush.noField();
      resetBrush();
    }

    function drawWallGesture(g) {
      if (!g.pts || g.pts.length < 2) return;
      resetBrush();
      const closed = !!g.closed;
      const boxy = !!g.boxy;
      const minS = Math.min(width, height);
      const halfW = g.halfW != null ? g.halfW : minS * 0.0062;
      // A boxy wall must not be run through chaikin — it rounds the four
      // corners away and the courtyard comes back as an oval.
      const pts = boxy
        ? jitter(densify(g.pts, Math.max(5, halfW * 0.6), closed), 0.75)
        : analogize(g.pts, 0.9, 1, closed);
      const curve = boxy ? 0.02 : 0.18;
      const left = offsetEdge(pts, halfW, closed);
      const right = offsetEdge(pts, -halfW, closed);
      const rib = ribbon(pts, halfW, closed);

      resetBrush();
      // Ink poché between the two faces — green belonged to the planting
      // family and made every wall read as a clipped hedge.
      if (closed) {
        brush.hatchStyle(random() > 0.5 ? B.H2 : B.HB, pal("ink"), random(0.3, 0.4));
        brush.hatch(random(5, 8), headingOf(pts) + 90, {
          rand: 0.1,
          continuous: false,
          gradient: 0
        });
        brush.polygon(rib);
        brush.noHatch();
      } else {
        brush.fill(pal("ink"), 100);
        brush.fillBleed(0);
        forOpenRibbonQuads(pts, halfW, function (q) { brush.polygon(q); });
        brush.noFill();
      }

      resetBrush();
      analogTooth();
      brush.set(B.charcoal, pal("ink"), 0.7);
      shape(boxy ? jitter(left, 0.7) : chaikin(jitter(left, 0.8), 1, closed), closed, curve);
      analogTooth();
      brush.set(random() > 0.5 ? B.HB : B.rotring, pal("ink"), 0.5);
      shape(boxy ? jitter(right, 0.7) : chaikin(jitter(right, 0.8), 1, closed), closed, curve);

      analogTooth();
      brush.set(B.rotring, pal("ink"), 0.4);
      brush.noField();
      const copePts = resample(pts, Math.max(14, halfW * 5.5), closed);
      const copeLen = halfW * 0.5;
      for (let i = 0; i < copePts.length; i++) {
        const h = headingAt(copePts, i, closed);
        const nx = -sin(h);
        const ny = cos(h);
        const p = copePts[i];
        const lx = p[0] + nx * halfW;
        const ly = p[1] + ny * halfW;
        brush.line(lx, ly, lx + nx * copeLen, ly + ny * copeLen);
      }

      analogTooth();
      brush.set(B.charcoal, pal("ink"), 0.62);
      const corners = g.corners && g.corners.length ? g.corners : findCorners(pts, closed);
      for (let i = 0; i < corners.length; i++) {
        const c = corners[i];
        // c.i indexes the committed spine; pts has been densified/smoothed
        // since, so resolve the corner by position rather than by index.
        const idx = nearestIndex(pts, c.x, c.y);
        const h = headingAt(pts, idx, closed);
        const nx = -sin(h);
        const ny = cos(h);
        const cope = halfW * 1.15;
        brush.line(c.x + nx * halfW * 0.2, c.y + ny * halfW * 0.2, c.x + nx * (halfW + cope), c.y + ny * (halfW + cope));
      }

      brush.noField();
      resetBrush();
    }

    // --- WebMCP: agent tools on the live sheet (same commit path as the hand) ---
    function lotFromNorm(nx, ny) {
      const x = lot.x + Math.max(0, Math.min(1, Number(nx))) * lot.w;
      const y = lot.y + Math.max(0, Math.min(1, Number(ny))) * lot.h;
      return [x, y];
    }

    function parseAgentPoints(input) {
      const raw = (input && input.points) || [];
      if (!Array.isArray(raw) || !raw.length) {
        throw new Error("points required: array of {x,y} in 0–1 lot space");
      }
      const out = [];
      for (let i = 0; i < raw.length; i++) {
        const pt = raw[i];
        if (Array.isArray(pt) && pt.length >= 2) out.push(lotFromNorm(pt[0], pt[1]));
        else if (pt && typeof pt === "object") out.push(lotFromNorm(pt.x, pt.y));
        else throw new Error("each point must be {x,y} or [x,y] in 0–1 lot space");
      }
      return out;
    }

    function flashToolRail(sel) {
      const dock = document.getElementById("dock");
      if (!dock || !sel) return;
      const el = dock.querySelector(sel);
      if (!el) return;
      const flashed = dock.querySelectorAll(".flash");
      for (let i = 0; i < flashed.length; i++) flashed[i].classList.remove("flash");
      el.classList.add("flash");
      if (toolFlashTimer) clearTimeout(toolFlashTimer);
      toolFlashTimer = setTimeout(function () {
        el.classList.remove("flash");
        toolFlashTimer = null;
      }, 400);
    }

    function agentLay(toolMode, input) {
      if (drawing) endStroke();
      const pts = parseAgentPoints(input);
      const prev = mode;
      mode = toolMode;
      liveT0 = millis() - 900;
      const before = gestures.length;
      agentPending = true;
      try {
        commitLive(pts);
      } finally {
        agentPending = false;
      }
      showEmpty();
      if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }
      // No forced full-history analog — commit already stamped hand; the new
      // gesture is inked onto the existing cache on the next pass.
      paintNow();
      mode = prev;
      updateCaption();
      const added = gestures.length - before;
      if (added <= 0) {
        return {
          ok: false,
          tool: toolMode,
          reason: "gesture not committed — give the tool a fuller stroke",
          gestures: gestures.length
        };
      }
      flashToken("laid");
      flashToolRail('.tool[data-mode="' + toolMode + '"]');
      const g = gestures[gestures.length - 1];
      return {
        ok: true,
        tool: toolMode,
        kind: g.kind,
        rill: !!g.rill,
        gestures: gestures.length,
        points_used: pts.length
      };
    }

    function agentClearSheet() {
      if (drawing) endStroke();
      clearGestures();
      paintNow();
      flashToken("cleared");
      flashToolRail('[data-act="clear"]');
      return { ok: true, gestures: 0 };
    }

    function agentExportSheet() {
      if (drawing || suppressExport) {
        return { ok: false, reason: "still drawing — wait for the stroke to settle" };
      }
      exportSheet();
      flashToken("taken");
      flashToolRail('[data-act="export"]');
      return { ok: true, file: "yard-draft.png", covered: true };
    }

    const YARD_WEBMCP_TOOLS = [
      {
        name: "lay_contour",
        title: "Lay a contour",
        description: "Lay a contour on the courtyard sheet — the same Terrain stroke a hand would drag. Pass points across the dashed lot: 0 is left/top, 1 is right/bottom.",
        inputSchema: {
          type: "object",
          properties: {
            points: {
              type: "array",
              minItems: 3,
              description: "Stroke points across the dashed lot (0 left/top → 1 right/bottom).",
              items: {
                type: "object",
                properties: {
                  x: { type: "number", minimum: 0, maximum: 1 },
                  y: { type: "number", minimum: 0, maximum: 1 }
                },
                required: ["x", "y"]
              }
            }
          },
          required: ["points"]
        },
        annotations: { readOnlyHint: false, consequentialHint: false },
        execute: async function (input) { return agentLay("topo", input); }
      },
      {
        name: "lay_water",
        title: "Lay water",
        description: "Lay water on the sheet. An open stroke reads as a rill; bring the ends back to hold a pool. Same paper as a hand Water stroke. Points: 0 left/top → 1 right/bottom inside the dashed lot.",
        inputSchema: {
          type: "object",
          properties: {
            points: {
              type: "array",
              minItems: 3,
              description: "Water stroke across the dashed lot (0 left/top → 1 right/bottom).",
              items: {
                type: "object",
                properties: {
                  x: { type: "number", minimum: 0, maximum: 1 },
                  y: { type: "number", minimum: 0, maximum: 1 }
                },
                required: ["x", "y"]
              }
            }
          },
          required: ["points"]
        },
        annotations: { readOnlyHint: false },
        execute: async function (input) { return agentLay("water", input); }
      },
      {
        name: "lay_planting",
        title: "Lay planting",
        description: "Lay planting on the sheet. One quiet point sets a tree; a longer stroke lays a hedge. Same as a hand Planting. Points: 0 left/top → 1 right/bottom inside the dashed lot.",
        inputSchema: {
          type: "object",
          properties: {
            points: {
              type: "array",
              minItems: 1,
              description: "One point for a tree; a stroke for a hedge (0 left/top → 1 right/bottom).",
              items: {
                type: "object",
                properties: {
                  x: { type: "number", minimum: 0, maximum: 1 },
                  y: { type: "number", minimum: 0, maximum: 1 }
                },
                required: ["x", "y"]
              }
            }
          },
          required: ["points"]
        },
        annotations: { readOnlyHint: false },
        execute: async function (input) { return agentLay("plant", input); }
      },
      {
        name: "lay_path",
        title: "Lay a path",
        description: "Lay a stone walk on the sheet — the same Path stroke a hand would drag, corners kept. Points: 0 left/top → 1 right/bottom inside the dashed lot.",
        inputSchema: {
          type: "object",
          properties: {
            points: {
              type: "array",
              minItems: 3,
              description: "Walk stroke across the dashed lot (0 left/top → 1 right/bottom).",
              items: {
                type: "object",
                properties: {
                  x: { type: "number", minimum: 0, maximum: 1 },
                  y: { type: "number", minimum: 0, maximum: 1 }
                },
                required: ["x", "y"]
              }
            }
          },
          required: ["points"]
        },
        annotations: { readOnlyHint: false },
        execute: async function (input) { return agentLay("path", input); }
      },
      {
        name: "lay_wall",
        title: "Lay a wall",
        description: "Lay a wall or edge on the sheet. An open stroke is a run; a boxy loop holds an enclosure. Same as a hand Wall. Points: 0 left/top → 1 right/bottom inside the dashed lot.",
        inputSchema: {
          type: "object",
          properties: {
            points: {
              type: "array",
              minItems: 3,
              description: "Wall stroke across the dashed lot (0 left/top → 1 right/bottom).",
              items: {
                type: "object",
                properties: {
                  x: { type: "number", minimum: 0, maximum: 1 },
                  y: { type: "number", minimum: 0, maximum: 1 }
                },
                required: ["x", "y"]
              }
            }
          },
          required: ["points"]
        },
        annotations: { readOnlyHint: false },
        execute: async function (input) { return agentLay("wall", input); }
      },
      {
        name: "clear_sheet",
        title: "Clear the sheet",
        description: "Clear every gesture from the courtyard sheet. The dashed lot, north mark, and scale stay. Same as Clear the sheet / c.",
        inputSchema: { type: "object", properties: {}, additionalProperties: false },
        annotations: { readOnlyHint: false, consequentialHint: true },
        execute: async function () { return agentClearSheet(); }
      },
      {
        name: "export_sheet",
        title: "Take the sheet",
        description: "Take the covered hangable sheet as yard-draft.png — vellum down, ready to hang. Same as Take the sheet / e.",
        inputSchema: { type: "object", properties: {}, additionalProperties: false },
        annotations: { readOnlyHint: true },
        execute: async function () { return agentExportSheet(); }
      }

    async function registerYardWebMCP() {
      window.__YardDraftWebMCP = {
        tools: YARD_WEBMCP_TOOLS.map(function (t) {
          return { name: t.name, title: t.title, description: t.description, inputSchema: t.inputSchema };
        }),
        invoke: async function (name, input) {
          const t = YARD_WEBMCP_TOOLS.find(function (x) { return x.name === name; });
          if (!t) throw new Error("unknown tool: " + name);
          return t.execute(input || {});
        }
      };

      function showWebmcpPill() {
        const el = document.getElementById("webmcp-pill");
        if (!el) return;
        el.classList.remove("on");
        void el.offsetWidth;
        el.classList.add("on");
        el.setAttribute("aria-hidden", "false");
      }
      showWebmcpPill();

      const modelContext = document.modelContext || navigator.modelContext;
      if (!modelContext || typeof modelContext.registerTool !== "function") {
        console.info("[Yard Draft WebMCP] document.modelContext unavailable — tools on window.__YardDraftWebMCP.invoke for local smoke; native register needs WebMCP-capable Chrome (HTTPS / localhost).");
        return { native: false, tools: YARD_WEBMCP_TOOLS.map(function (t) { return t.name; }) };
      }

      const names = [];
      for (let i = 0; i < YARD_WEBMCP_TOOLS.length; i++) {
        const t = YARD_WEBMCP_TOOLS[i];
        try {
          await modelContext.registerTool({
            name: t.name,
            title: t.title,
            description: t.description,
            inputSchema: t.inputSchema,
            annotations: t.annotations,
            execute: t.execute
          });
          names.push(t.name);
        } catch (err) {
          console.warn("[Yard Draft WebMCP] registerTool failed for " + t.name, err);
        }
      }
      console.info("[Yard Draft WebMCP] registered", names.join(", "));
      window.__YardDraftWebMCP.native = true;
      window.__YardDraftWebMCP.registered = names;
      return { native: true, tools: names };
    }
  </script>
