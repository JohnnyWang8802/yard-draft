<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yard Draft</title>
  <style>
    :root {
      --paper: #EFE6D0;
      --tray:  #FFFFFF;
      --ink:   #2c281f;
      --olive: #55613a;
      --terra: #8f4e38;
      --water: #6e7f86;
      --mute:  rgba(44,40,31,0.48);
      --sheet-shadow: rgba(44,40,31,0.06);
    }
    body.dark {
      --paper: #1A1A1A;
      --tray:  #111111;
      --ink:   #efe6d0;
      --mute:  rgba(239,230,208,0.48);
      --sheet-shadow: rgba(0,0,0,0.35);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--tray);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    canvas { display: block; }
    #dock {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 232px;
      z-index: 30;
      pointer-events: auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 18px 14px 20px;
      background: var(--tray);
      border-right: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
      box-shadow: 4px 0 24px var(--sheet-shadow);
      color: var(--ink);
      overflow-y: auto;
      user-select: none;
      font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
    }
    #head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      width: 204px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
      color: var(--ink);
    }
    #head .mark {
      flex-shrink: 0;
      display: block;
      width: 28px;
      height: 28px;
      overflow: visible;
    }
    #title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1.2;
      color: var(--ink);
    }
    #tools {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-shrink: 0;
    }
    .tool {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 60px;
      box-sizing: border-box;
      margin: 0 0 4px;
      padding: 8px 10px;
      background: transparent;
      border: none;
      border-radius: 8px;
      box-shadow: none;
      appearance: none;
      -webkit-appearance: none;
      text-align: left;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      opacity: 1;
      transition: background 120ms ease;
    }
    .tool:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
    .tool:focus { outline: none; }
    .tool:focus-visible { box-shadow: inset 0 0 0 1px var(--ink); }
    .tool.on {
      background: var(--ink);
      color: var(--paper);
      opacity: 1;
    }
    .tool.on:hover { background: var(--ink); opacity: 1; }
    .tool.flash {
      background: var(--ink);
      color: var(--paper);
      opacity: 1;
    }
    .tool.flash .name { color: var(--paper); opacity: 1; }
    .tool.flash .k { display: inline; color: var(--paper); }
    .tool.flash .chip .olive { stroke: none; }
    .tool.flash .chip .ink { stroke: var(--paper); }
    #actions button.flash {
      background: color-mix(in srgb, var(--ink) 14%, transparent);
    }
    .tool .chip {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: block;
    }
    .tool .meta { min-width: 0; flex: 1; }
    .tool .name {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.1;
      display: block;
      color: var(--ink);
      opacity: 0.90;
    }
    .tool.on .name {
      color: var(--paper);
      opacity: 1;
    }
    .tool .k {
      display: none;
      font-size: 11px;
      letter-spacing: 0.04em;
      flex-shrink: 0;
      margin-left: auto;
      color: var(--paper);
    }
    .tool.on .k { display: inline; }
    .chip .ink { stroke: var(--ink); fill: none; }
    .chip .sap { stroke: #6a7a3d; fill: none; }
    .chip .olive { fill: var(--olive); stroke: var(--tray); stroke-width: 1.2; }
    .tool.on .chip .olive { stroke: none; }
    .chip .pool { fill: var(--water); }
    .chip .terra { fill: #b56848; }
    .chip .rill { stroke: var(--water); fill: none; }
    .tool.on .chip .ink { stroke: var(--paper); }
    #foot {
      margin-top: auto;
      flex-shrink: 0;
    }
    #tone {
      display: block;
      margin: 0 0 8px;
      padding: 0;
      background: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      appearance: none;
      -webkit-appearance: none;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.2;
      color: var(--mute);
      cursor: pointer;
      text-align: left;
    }
    #tone:focus { outline: none; }
    #tone:focus-visible { box-shadow: inset 0 0 0 1px var(--ink); }
    #actions {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-shrink: 0;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    }
    #actions button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      min-height: 40px;
      box-sizing: border-box;
      margin: 0;
      padding: 0 4px;
      background: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      appearance: none;
      -webkit-appearance: none;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }
    #actions button[data-act="clear"],
    #actions button[data-act="export"] {
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    #actions button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
    #actions button:focus { outline: none; }
    #actions button:focus-visible { box-shadow: inset 0 0 0 1px var(--ink); }
    #actions .k {
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--mute);
    }
    .tone-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      box-sizing: border-box;
      padding: 0 4px;
    }
    .tone-row button[data-act="dark"] {
      width: auto;
      flex: 1 1 auto;
      min-width: 0;
      padding: 0;
    }
    #vellum-alpha {
      -webkit-appearance: none;
      appearance: none;
      width: 64px;
      height: 2.5px;
      flex: 0 0 64px;
      margin: 0;
      padding: 0;
      background: color-mix(in srgb, var(--ink) 22%, transparent);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    #vellum-alpha::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ink);
      border: none;
      opacity: 0.55;
      cursor: pointer;
    }
    #vellum-alpha::-moz-range-thumb {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ink);
      border: none;
      opacity: 0.55;
      cursor: pointer;
    }
    #vellum-alpha:focus-visible {
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 35%, transparent);
    }
    #alpha-flash {
      position: fixed;
      left: calc(232px + (100vw - 232px) / 2);
      top: 42%;
      transform: translate(-50%, -50%);
      z-index: 21;
      pointer-events: none;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink);
      opacity: 0;
      transition: opacity 0.55s ease-out;
    }
    #alpha-flash.on {
      opacity: 0.28;
      transition: opacity 0.08s linear;
    }
    #empty {
      position: fixed;
      left: 232px;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      pointer-events: none;
      z-index: 15;
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    #empty.off { display: none; }
    #empty .prompt {
      font-size: 16px;
      letter-spacing: 0.04em;
      color: var(--ink);
      opacity: 0.32;
      pointer-events: none;
    }
    #empty .line {
      font-size: 13.5px;
      color: var(--ink);
      opacity: 0.34;
      margin-top: 9px;
      max-width: 28em;
      text-align: center;
      pointer-events: none;
    }
    #webmcp-pill {
      position: fixed;
      left: calc(232px + (100vw - 232px) / 2);
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 16;
      pointer-events: none;
      padding: 5px 11px;
      border-radius: 999px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.03em;
      font-weight: 400;
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 55%, transparent);
      border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
      box-shadow: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 200ms ease, visibility 200ms ease;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    #webmcp-pill.on {
      opacity: 0.52;
      visibility: visible;
    }
    body.dark #webmcp-pill {
      background: color-mix(in srgb, var(--paper) 55%, transparent);
      border-color: color-mix(in srgb, var(--ink) 22%, transparent);
    }
    #token { display: none;
      position: fixed;
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      font-size: 9vw;
      font-weight: 500;
      letter-spacing: -0.05em;
      color: #2c281f;
      opacity: 0;
      white-space: nowrap;
      transition: opacity 0.55s ease-out;
    }
    body.dark #token { color: #efe6d0; }
    #token.on {
      opacity: 0.10;
      transition: opacity 0.07s linear;
    }
  </style>

          <button type="button" data-act="dark">Tone<span class="k">d</span></button>

  </div>
  <div id="alpha-flash" aria-hidden="true"></div>
  <script>
    const LIGHT = {
      paper: "#efe6d0",
      ink: "#2c281f",
      olive: "#55613a",
      sap: "#6a7a3d",
      sapDeep: "#3f4a28",
      sepia: "#8a6a44",
      sepiaDeep: "#6b4f31",
      terracotta: "#b56848",
      terraDeep: "#8f4e38",
      water: "#6e7f86",
      waterDeep: "#55656c",
      pave: "#d4c6ac",
      tray: "#FFFFFF",
      vellum: "#E8CC6A"
    };
    const DARK = {
      paper: "#1A1A1A",
      ink: "#efe6d0",
      olive: "#8a9a5c",
      sap: "#9aaa62",
      sapDeep: "#6d7c48",
      sepia: "#c09a70",
      sepiaDeep: "#a8825c",
      terracotta: "#d08a6a",
      terraDeep: "#c07a58",
      water: "#8a9ba2",
      waterDeep: "#708088",
      pave: "#3d382c",
      tray: "#111111",
      vellum: "#C9A63A"
    };

    let mode = "topo";
    let dark = false;
    let passSeed = 1400;
    let analogDirty = true;
    let sheetCache = null;
    let bakedUpTo = 0;
    let lastSettleAnalog = 0;
    let sheetRev = 0;
    let settledRev = -1;
    const SETTLE_ANALOG_MIN = 1500;
    const ANALOG_MAX = 10;
    let brushesScaled = false;
    let B = {};
    let lot = {};
    let gestures = [];
    let agentPending = false;
    let toolFlashTimer = null;
    let livePts = null;
    let strokeLock = false;
    let liveT0 = 0;
    let drawing = false;
    let suppressExport = false;
    let hasPtr = false;
    let seedSeq = 1;
    let settleTimer = null;
    let tokenTimer = null;
    let lastDragDraw = 0;
    let vellumKey = false;
    let deskLift = false;
    let vellumAlpha = 152; // Tone-row slider: 40–220
    let alphaFlashTimer = null;
    let toneTimer = null;

    function flashAlphaPct() {
      const el = document.getElementById("alpha-flash");
      if (!el) return;
      const pct = Math.round((vellumAlpha / 255) * 100);
      el.textContent = pct + "%";
      el.classList.add("on");
      if (alphaFlashTimer) clearTimeout(alphaFlashTimer);
      alphaFlashTimer = setTimeout(function () {
        el.classList.remove("on");
        alphaFlashTimer = null;
      }, 600);
    }

    function setVellumAlpha(next, flash) {
      next = Math.max(40, Math.min(220, next | 0));
      if (next === vellumAlpha) return;
      vellumAlpha = next;
      const sl = document.getElementById("vellum-alpha");
      if (sl && Number(sl.value) !== vellumAlpha) sl.value = String(vellumAlpha);
      // Paper tone is baked under the ink now (see lotBackdropColor), so it
      // needs a rebuild — debounced so dragging the slider does not replay
      // every stroke on each input event.
      if (toneTimer) clearTimeout(toneTimer);
      toneTimer = setTimeout(function () {
        toneTimer = null;
        invalidateSheetCache();
        paintNow();
      }, 140);
      if (flash) flashAlphaPct();
    }
    let bakingWorld = false;
    const SETTLE_MS = 700;
    const DOCK_W = 232;
    let viewZoom = 1;
    let viewPanX = 0;
    let viewPanY = 0;
    let spaceHeld = false;
    let panning = false;
    let panLastX = 0;
    let panLastY = 0;
    const VIEW_ZMIN = 0.5;
    const VIEW_ZMAX = 2.5;
    const DOT_STEP = 14;
    let dotLayer = null;
    let dotLayerKey = "";

    function lotCenter() {
      return [lot.x + lot.w * 0.5, lot.y + lot.h * 0.5];
    }

    function applyWorldView() {
      const c = lotCenter();
      translate(viewPanX, viewPanY);
      translate(c[0], c[1]);
      scale(viewZoom);
      translate(-c[0], -c[1]);
    }

    function sheetFromScreen(sx, sy) {
      const c = lotCenter();
      let x = sx - viewPanX;
      let y = sy - viewPanY;
      x = (x - c[0]) / viewZoom + c[0];
      y = (y - c[1]) / viewZoom + c[1];
      return [x, y];
    }

    function worldPointer(evt) {
      const s = canvasXY(evt);
      return sheetFromScreen(s[0], s[1]);
    }

    function overSheet(x, y) {
      if (x == null || y == null) {
        x = mouseX;
        y = mouseY;
      }
      return x >= DOCK_W && x <= width && y >= 0 && y <= height;
    }

    function inLotWorld(x, y) {
      return x >= lot.x && x <= lot.x + lot.w && y >= lot.y && y <= lot.y + lot.h;
    }

    function inLot(x, y) {
      if (x == null || y == null) {
        const w = sheetFromScreen(mouseX, mouseY);
        x = w[0];
        y = w[1];
      }
      return inLotWorld(x, y);
    }

    function onDesk(x, y) {
      if (x == null || y == null) {
        x = mouseX;
        y = mouseY;
      }
      if (!overSheet(x, y)) return false;
      const w = sheetFromScreen(x, y);
      return !inLotWorld(w[0], w[1]);
    }

    function vellumLifted() {
      return !drawing && (vellumKey || deskLift);
    }

    function stampHand(g, raw, closed) {
      const src = (raw && raw.length) ? raw.map(function (pt) { return [pt[0], pt[1]]; }) : [];
      if (src.length === 1) src.push([src[0][0] + 0.4, src[0][1] + 8]);
      g.handSrc = src;
      g.handClosed = !!closed;
      g.hand = src.length >= 2 ? analogize(src.map(function (pt) { return [pt[0], pt[1]]; }), 0.4, 1, g.handClosed) : src;
    }

    function refreshHands() {
      for (let i = 0; i < gestures.length; i++) {
        const g = gestures[i];
        if (!g.handSrc || g.handSrc.length < 2) continue;
        g.hand = analogize(g.handSrc.map(function (pt) { return [pt[0], pt[1]]; }), 0.4, 1, !!g.handClosed);
      }
    }

    function drawHandLayer(g) {
      const pts = g.hand;
      if (!pts || pts.length < 2) return;
      resetBrush();
      analogTooth();
      brush.noFill();
      brush.noHatch();
      brush.set(random() > 0.5 ? B.H2 : B.charcoal, pal("ink"), random(0.30, 0.42));
      shape(pts, !!g.handClosed, 0.08);
      brush.noField();
    }

    function canvasXY(evt) {
      if (evt && evt.clientX != null) {
        const cnv = (typeof canvas !== "undefined" && canvas && canvas.elt) ? canvas.elt : document.querySelector("canvas");
        if (cnv) {
          const r = cnv.getBoundingClientRect();
          const sx = r.width ? width / r.width : 1;
          const sy = r.height ? height / r.height : 1;
          return [(evt.clientX - r.left) * sx, (evt.clientY - r.top) * sy];
        }
        return [evt.clientX, evt.clientY];
      }
      return [mouseX, mouseY];
    }

    function pal(k) {
      return (dark ? DARK : LIGHT)[k];
    }

    function hash(s) {
      let h = 2166136261;
      const str = String(s);
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0) / 4294967296;
    }

    function nextSeed() {
      seedSeq += 1;
      return ((hash(seedSeq + ":" + passSeed) * 2147483647) | 0) || seedSeq;
    }

    function inPoly(x, y, pts) {
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i][0], yi = pts[i][1];
        const xj = pts[j][0], yj = pts[j][1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi) {
          inside = !inside;
        }
      }
      return inside;
    }

    function chaikin(pts, rounds, closed) {
      let p = pts;
      for (let r = 0; r < rounds; r++) {
        const n = [];
        const last = closed ? p.length : p.length - 1;
        if (!closed) n.push(p[0]);
        for (let i = 0; i < last; i++) {
          const a = p[i];
          const b = p[(i + 1) % p.length];
          n.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
          n.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
        }
        if (!closed) n.push(p[p.length - 1]);
        p = n;
      }
      return p;
    }

    function blob(cx, cy, rx, ry, n) {
      const pts = [];
      const count = n || 8;
      const rot = random(-18, 18);
      for (let i = 0; i < count; i++) {
        const a = (i / count) * 360 + rot;
        const k = 0.82 + noise(i * 0.37, passSeed * 0.02) * 0.34;
        pts.push([cx + cos(a) * rx * k, cy + sin(a) * ry * k]);
      }
      return pts;
    }

    function dashPath(pts, dashLen, gapLen) {
      if (!pts || pts.length < 2) return;
      // Short marks must not run under the flow field. analogTooth() switches
      // p5.brush's "hand" field on, and over a few pixels the field direction
      // dominates the segment's own: dashes, hachures and ticks get dragged
      // off across the sheet instead of landing where they were asked for.
      // That is why shore rings and downslope ticks silently vanished and
      // stray streaks appeared in the corners.
      brush.noField();
      let remain = dashLen;
      let drawingDash = true;
      for (let i = 0; i < pts.length - 1; i++) {
        let x0 = pts[i][0], y0 = pts[i][1];
        const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
        let seg = dist(x0, y0, x1, y1);
        if (seg < 0.5) continue;
        const ux = (x1 - x0) / seg;
        const uy = (y1 - y0) / seg;
        while (seg > 0.4) {
          const step = Math.min(seg, remain);
          const nx = x0 + ux * step;
          const ny = y0 + uy * step;
          if (drawingDash) brush.line(x0, y0, nx, ny);
          x0 = nx;
          y0 = ny;
          seg -= step;
          remain -= step;
          if (remain <= 0) {
            drawingDash = !drawingDash;
            remain = drawingDash ? dashLen : gapLen;
          }
        }
      }
    }

    let flushTick = 0;

    function flushBrushMarks() {
      // p5.brush batches marks by colour and only writes the pending batch back
      // to the canvas on p5's postdraw hook. bakeWorldCache() reads pixels from
      // inside draw(), so whatever was still buffered never reached the cache —
      // shore rings, hachures and joints went missing at random depending on
      // which gesture happened to end on a colour change. Switching colour
      // forces the write-back; the mark itself is off-canvas, so it paints
      // nothing and its own dirty rect clamps to empty.
      try {
        flushTick = (flushTick + 1) % 2;
        brush.set(B.HB, flushTick ? "#010203" : "#030201", 0.01);
        brush.noField();
        brush.line(-9999, -9999, -9998, -9998);
      } catch (err) {}
      resetBrush();
    }

    function resetBrush() {
      brush.noFill();
      brush.noWash();
      brush.noHatch();
      brush.noMass();
      brush.noStroke();
      brush.noField();
      brush.noClip();
    }

    function shape(pts, closed, curve) {
      if (!pts || pts.length < 2) return;
      // An open path used to be one brush stroke per segment: every joint got
      // re-inked, so lines read blotchy and dark at the seams and cost one
      // stroke pass each. One shape draws the whole path in a single pass.
      brush.beginShape(curve == null ? 0.32 : curve);
      for (let i = 0; i < pts.length; i++) brush.vertex(pts[i][0], pts[i][1]);
      brush.endShape(!!closed);
    }

    function pickBrush(box, names) {
      for (let i = 0; i < names.length; i++) {
        if (box.indexOf(names[i]) !== -1) return names[i];
      }
      return box[0];
    }

    function ribbonEdge(center, halfW, closed) {
      const e = [];
      const n = center.length;
      for (let i = 0; i < n; i++) {
        const prev = closed ? center[(i + n - 1) % n] : center[Math.max(0, i - 1)];
        const next = closed ? center[(i + 1) % n] : center[Math.min(n - 1, i + 1)];
        const dx = next[0] - prev[0];
        const dy = next[1] - prev[1];
        const len = Math.hypot(dx, dy) || 1;
        e.push([center[i][0] + (-dy / len) * halfW, center[i][1] + (dx / len) * halfW]);
      }
      return e;
    }

    // An offset edge folds back on itself wherever the centreline turns tighter
    // than halfW. Dropping the points that travel against the centreline tangent
    // collapses that loop into a mitre instead of leaving a crossed knot.
    function pruneFold(center, edge, closed) {
      // Where an offset folds back on the inside of a bend, collapse it onto
      // the previous point instead of dropping it. Dropping left the inner
      // edge with fewer points than the outer one, so ribbon() built a skewed
      // polygon: the channel core rode the inside of every curve and the inner
      // bank line went missing. Same count in, same count out — the two faces
      // stay in correspondence and the band stays centred on the stroke.
      if (!edge || edge.length < 3 || edge.length !== center.length) return edge;
      const out = [];
      for (let i = 0; i < edge.length; i++) {
        const h = headingAt(center, i, closed);
        const tx = cos(h);
        const ty = sin(h);
        let px = edge[i][0];
        let py = edge[i][1];
        if (out.length) {
          const prev = out[out.length - 1];
          if ((px - prev[0]) * tx + (py - prev[1]) * ty <= 0) {
            px = prev[0];
            py = prev[1];
          }
        }
        out.push([px, py]);
      }
      return out.length >= 2 ? out : edge;
    }

    function offsetEdge(center, halfW, closed) {
      return pruneFold(center, ribbonEdge(center, halfW, closed), closed);
    }

    function ribbon(center, halfW, closed) {
      const L = offsetEdge(center, halfW, closed);
      const R = offsetEdge(center, -halfW, closed);
      return L.concat(R.slice().reverse());
    }

    function forOpenRibbonQuads(center, halfW, fn) {
      if (!center || center.length < 2) return;
      let total = 0;
      for (let j = 1; j < center.length; j++) {
        total += Math.hypot(center[j][0] - center[j - 1][0], center[j][1] - center[j - 1][1]);
      }
      const cap = total * 0.25;
      for (let i = 0; i < center.length - 1; i++) {
        const a = center[i];
        const b = center[i + 1];
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const len = Math.hypot(dx, dy) || 1;
        if (len > cap) continue;
        const nx = -dy / len;
        const ny = dx / len;
        fn([
          [a[0] + nx * halfW, a[1] + ny * halfW],
          [b[0] + nx * halfW, b[1] + ny * halfW],
          [b[0] - nx * halfW, b[1] - ny * halfW],
          [a[0] - nx * halfW, a[1] - ny * halfW]
        ]);
      }
    }

    // Adds points along each segment while keeping every original vertex, so a
    // hard-cornered spine can carry a ribbon without losing its corners.
    function densify(pts, step, closed) {
      if (!pts || pts.length < 2) return pts;
      const out = [];
      const n = pts.length;
      const last = closed ? n : n - 1;
      for (let i = 0; i < last; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % n];
        const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const k = Math.max(1, Math.round(d / Math.max(1, step)));
        for (let s = 0; s < k; s++) {
          const t = s / k;
          out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
        }
      }
      if (!closed) out.push([pts[n - 1][0], pts[n - 1][1]]);
      return out;
    }

    function nearestIndex(pts, x, y) {
      let best = 0;
      let bd = Infinity;
      for (let i = 0; i < pts.length; i++) {
        const d = (pts[i][0] - x) * (pts[i][0] - x) + (pts[i][1] - y) * (pts[i][1] - y);
        if (d < bd) {
          bd = d;
          best = i;
        }
      }
      return best;
    }

    function jitter(pts, amt) {
      return pts.map((p) => [p[0] + random(-amt, amt), p[1] + random(-amt, amt)]);
    }

    function analogize(pts, amt, rounds, closed) {
      return chaikin(jitter(pts, amt), rounds, closed);
    }

    function resample(pts, spacing, closed) {
      if (!pts || pts.length < 2) return pts ? pts.map((p) => [p[0], p[1]]) : [];
      const src = pts.map((p) => [p[0], p[1]]);
      if (closed) src.push([pts[0][0], pts[0][1]]);
      const step = Math.max(1.2, spacing);
      const out = [[src[0][0], src[0][1]]];
      let carry = 0;
      for (let i = 1; i < src.length; i++) {
        let x0 = src[i - 1][0];
        let y0 = src[i - 1][1];
        const x1 = src[i][0];
        const y1 = src[i][1];
        let remaining = Math.hypot(x1 - x0, y1 - y0);
        if (remaining < 1e-6) continue;
        const ux = (x1 - x0) / remaining;
        const uy = (y1 - y0) / remaining;
        const need = step - carry;
        if (remaining < need) {
          carry += remaining;
          continue;
        }
        x0 += ux * need;
        y0 += uy * need;
        remaining -= need;
        out.push([x0, y0]);
        while (remaining >= step) {
          x0 += ux * step;
          y0 += uy * step;
          remaining -= step;
          out.push([x0, y0]);
        }
        carry = remaining;
      }
      if (!closed) {
        const last = src[src.length - 1];
        const prev = out[out.length - 1];
        if (Math.hypot(last[0] - prev[0], last[1] - prev[1]) > step * 0.28) {
          out.push([last[0], last[1]]);
        }
      } else if (out.length > 1) {
        const prev = out[out.length - 1];
        if (Math.hypot(prev[0] - out[0][0], prev[1] - out[0][1]) < step * 0.4) out.pop();
      }
      return out;
    }

    function jitterSeeded(pts, amt, seed) {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const u = hash(seed + ":x:" + i) * 2 - 1;
        const v = hash(seed + ":y:" + i) * 2 - 1;
        out.push([pts[i][0] + u * amt, pts[i][1] + v * amt]);
      }
      return out;
    }

    function stripClosedDup(pts) {
      if (!pts || pts.length < 3) return pts;
      const a = pts[0];
      const b = pts[pts.length - 1];
      if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 8) return pts.slice(0, -1);
      return pts;
    }

    function beautify(pts, opts) {
      const closed = !!(opts && opts.closed);
      const rounds = opts && opts.rounds != null ? opts.rounds : (closed ? 3 : 2);
      const seed = (opts && opts.seed) || 1;
      const jit = opts && opts.jitter != null ? opts.jitter : 0.5;
      let p = closed ? stripClosedDup(pts) : pts;
      p = chaikin(p, rounds, closed);
      if (opts && opts.step) p = resample(p, opts.step, closed);
      return jitterSeeded(p, jit, seed);
    }

    function fittedBasin(pts, seed) {
      if (isBoxy(pts)) {
        const bb = bboxOf(pts);
        const inset = Math.min(bb.w, bb.h) * 0.035 + 2;
        const rect = [
          [bb.x + inset, bb.y + inset],
          [bb.x + bb.w - inset, bb.y + inset],
          [bb.x + bb.w - inset, bb.y + bb.h - inset],
          [bb.x + inset, bb.y + bb.h - inset]
        ];
        return { pts: jitterSeeded(rect, 1.15, seed), boxy: true };
      }
      return { pts: beautify(pts, { closed: true, rounds: 3, jitter: 0.55, seed: seed }), boxy: false };
    }

    function polyLen(pts) {
      let L = 0;
      for (let i = 1; i < pts.length; i++) {
        L += dist(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
      }
      return L;
    }

    function headingOf(pts) {
      let sx = 0, sy = 0;
      for (let i = 1; i < pts.length; i++) {
        sx += pts[i][0] - pts[i - 1][0];
        sy += pts[i][1] - pts[i - 1][1];
      }
      if (Math.hypot(sx, sy) < 1) {
        return atan2(pts[pts.length - 1][1] - pts[0][1], pts[pts.length - 1][0] - pts[0][0]);
      }
      return atan2(sy, sx);
    }

    function bboxOf(pts) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < pts.length; i++) {
        minX = Math.min(minX, pts[i][0]);
        minY = Math.min(minY, pts[i][1]);
        maxX = Math.max(maxX, pts[i][0]);
        maxY = Math.max(maxY, pts[i][1]);
      }
      return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    function shoelace(pts) {
      let a = 0;
      for (let i = 0; i < pts.length; i++) {
        const j = (i + 1) % pts.length;
        a += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
      }
      return a / 2;
    }

    // How many of the bounding box's four sides the stroke actually runs along.
    // An L covers two, a U three, a closed rectangle four.
    function sidesCovered(pts, bb) {
      const tol = Math.max(6, Math.min(bb.w, bb.h) * 0.16);
      const sides = [
        { horiz: true, at: bb.y, span: bb.w },
        { horiz: true, at: bb.y + bb.h, span: bb.w },
        { horiz: false, at: bb.x, span: bb.h },
        { horiz: false, at: bb.x + bb.w, span: bb.h }
      ];
      let count = 0;
      for (let s = 0; s < sides.length; s++) {
        const side = sides[s];
        let lo = Infinity;
        let hi = -Infinity;
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          const off = side.horiz ? Math.abs(p[1] - side.at) : Math.abs(p[0] - side.at);
          if (off > tol) continue;
          const t = side.horiz ? p[0] : p[1];
          lo = Math.min(lo, t);
          hi = Math.max(hi, t);
        }
        if (hi - lo > side.span * 0.62) count++;
      }
      return count;
    }

    function isBoxy(pts) {
      if (!pts || pts.length < 8) return false;
      const bb = bboxOf(pts);
      if (bb.w < 16 || bb.h < 16) return false;
      if (sidesCovered(pts, bb) < 3) return false;
      const fill = Math.abs(shoelace(pts)) / (bb.w * bb.h);
      let axis = 0, n = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const dx = Math.abs(pts[i + 1][0] - pts[i][0]);
        const dy = Math.abs(pts[i + 1][1] - pts[i][1]);
        const len = Math.hypot(dx, dy);
        if (len < 6) continue;
        n++;
        if (dx < dy * 0.28 || dy < dx * 0.28) axis++;
      }
      const axisFrac = n ? axis / n : 0;
      const thresh = Math.min(bb.w, bb.h) * 0.14;
      let hug = 0;
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const d = Math.min(p[0] - bb.x, bb.x + bb.w - p[0], p[1] - bb.y, bb.y + bb.h - p[1]);
        if (d <= thresh) hug++;
      }
      const hugFrac = hug / pts.length;
      return (fill > 0.72 && axisFrac > 0.5) || (hugFrac > 0.7 && axisFrac > 0.55);
    }


    function trimEnds(pts, frac) {
      if (!pts || pts.length < 2 || !(frac > 0)) return pts;
      const L = polyLen(pts);
      const cut = Math.min(L * 0.42, L * frac);
      if (cut < 1.4 || L - 2 * cut < 6) return pts;
      function cutFrom(src, amount, reverse) {
        const p = reverse ? src.slice().reverse() : src;
        let acc = 0;
        for (let i = 1; i < p.length; i++) {
          const d = dist(p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]);
          if (acc + d >= amount) {
            const t = (amount - acc) / (d || 1);
            const pt = [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * t, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * t];
            const rest = p.slice(i);
            rest.unshift(pt);
            return reverse ? rest.reverse() : rest;
          }
          acc += d;
        }
        return src;
      }
      return cutFrom(cutFrom(pts, cut, false), cut, true);
    }

    function downSignOf(pts) {
      const pos = ribbonEdge(pts, 8);
      const neg = ribbonEdge(pts, -8);
      let yp = 0, yn = 0;
      for (let i = 0; i < pos.length; i++) yp += pos[i][1];
      for (let i = 0; i < neg.length; i++) yn += neg[i][1];
      yp /= pos.length || 1;
      yn /= neg.length || 1;
      return yp >= yn ? 1 : -1;
    }

    function insetClosed(pts, d) {
      if (!pts || pts.length < 3) return pts;
      let cx = 0, cy = 0;
      for (let i = 0; i < pts.length; i++) {
        cx += pts[i][0];
        cy += pts[i][1];
      }
      cx /= pts.length;
      cy /= pts.length;
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const dx = cx - pts[i][0];
        const dy = cy - pts[i][1];
        const len = Math.hypot(dx, dy) || 1;
        out.push([pts[i][0] + (dx / len) * d, pts[i][1] + (dy / len) * d]);
      }
      return out;
    }

    function headingAt(pts, i, closed) {
      const n = pts.length;
      const prev = closed ? pts[(i + n - 1) % n] : pts[Math.max(0, i - 1)];
      const next = closed ? pts[(i + 1) % n] : pts[Math.min(n - 1, i + 1)];
      return atan2(next[1] - prev[1], next[0] - prev[0]);
    }

    function perpAt(pts, i, closed) {
      const h = headingAt(pts, i, closed);
      return [-sin(h), cos(h)];
    }

    function findCorners(pts, closed) {
      const corners = [];
      if (!pts || pts.length < 3) return corners;
      const n = pts.length;
      const lim = closed ? n : n - 1;
      for (let i = closed ? 0 : 1; i < lim; i++) {
        const p0 = pts[(i + n - 1) % n];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % n];
        const a1 = atan2(p1[1] - p0[1], p1[0] - p0[0]);
        const a2 = atan2(p2[1] - p1[1], p2[0] - p1[0]);
        let d = a2 - a1;
        while (d > 180) d -= 360;
        while (d < -180) d += 360;
        if (Math.abs(d) > 38) corners.push({ i: i, x: p1[0], y: p1[1] });
      }
      return corners;
    }

    function squareToBbox(pts, seed) {
      const bb = bboxOf(pts);
      const rect = [
        [bb.x, bb.y],
        [bb.x + bb.w, bb.y],
        [bb.x + bb.w, bb.y + bb.h],
        [bb.x, bb.y + bb.h]
      ];
      return jitterSeeded(rect, 0.95, seed);
    }

    function lobedCircle(cx, cy, r, lobes, depth, seed) {
      // A plan canopy is drawn with a broken, lobed edge — a plain circle
      // reads as a shrub blob and matched the hedge texture exactly.
      const n = Math.max(56, lobes * 12);
      const out = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const wob = Math.cos(a * lobes);
        const rr = r * (1 + depth * wob) *
          (1 + (hash(seed + ":lb:" + i) - 0.5) * 0.07);
        out.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
      }
      return out;
    }

    function ellipsePts(cx, cy, rx, ry, n) {
      const pts = [];
      const count = n || 10;
      const rot = random(-8, 8);
      for (let i = 0; i < count; i++) {
        const a = (i / count) * 360 + rot;
        pts.push([cx + cos(a) * rx, cy + sin(a) * ry]);
      }
      return pts;
    }

    function plantClumps(spine, halfW, seed) {
      const samples = resample(spine, Math.max(4, halfW * 1.25), false);
      const clumps = [];
      const headOff = Math.floor(hash(seed + ":hoff") * 6);
      for (let i = 0; i < samples.length; i++) {
        const nrm = perpAt(samples, i, false);
        const off = (hash(seed + ":off:" + i) * 2 - 1) * 0.38 * halfW;
        const x = samples[i][0] + nrm[0] * off;
        const y = samples[i][1] + nrm[1] * off;
        // brush.mass() scatters particles by absolute area, so clumps much
        // under ~12px come out as bare outlines. Keep the floor high enough.
        let r = (0.74 + hash(seed + ":r:" + i) * 0.5) * halfW;
        let tree = false;
        if ((i + headOff) % 6 === 0) {
          r *= 1.28;
          tree = true;
        }
        clumps.push({ x: x, y: y, r: r, tree: tree });
      }
      return clumps;
    }

    function analogTooth() {
      brush.wiggle(random(1.6, 2.8));
    }

    function flashToken(name) {
      const el = document.getElementById("token");
      el.textContent = "*" + name;
      el.classList.remove("on");
      void el.offsetWidth;
      el.classList.add("on");
      if (tokenTimer) clearTimeout(tokenTimer);
      tokenTimer = setTimeout(function () {
        el.classList.remove("on");
      }, 700);
    }

    function setMode(name) {
      if (drawing) endStroke();
      strokeLock = false;
      mode = name;
      updateCaption();
      // Switching tools changes nothing already on the sheet — keep the cache
      paintNow();
    }

    function toggleDark() {
      dark = !dark;
      markSheetChanged();
      document.body.classList.toggle("dark", dark);
      requestAnalog();
    }

    function undoLast() {
      if (!gestures.length) return;
      gestures.pop();
      markSheetChanged();
      showEmpty();
      requestAnalog();
    }

    function clearGestures() {
      if (!gestures.length) return;
      gestures = [];
      markSheetChanged();
      showEmpty();
      requestAnalog();
    }

    function exportSheet() {
      if (drawing || suppressExport) return;
      const holdKey = vellumKey;
      const holdDesk = deskLift;
      const holdZ = viewZoom;
      const holdPX = viewPanX;
      const holdPY = viewPanY;
      vellumKey = false;
      deskLift = false;
      viewZoom = 1;
      viewPanX = 0;
      viewPanY = 0;
      // Minimal: blit world cache at identity — do NOT invalidate (avoids full brush replay)
      // Synchronous compose — saveCanvas grabs the buffer now, and an async
      // paintNow() would still be queued when it does.
      if (!sheetCache) bakeWorldCache();
      composeViewport(null);
      saveCanvas("yard-draft", "png");
      vellumKey = holdKey;
      deskLift = holdDesk;
      viewZoom = holdZ;
      viewPanX = holdPX;
      viewPanY = holdPY;
      // Restore on-screen view via blit; cache still valid
      paintNow();
    }

    function showEmpty() {
      const el = document.getElementById("empty");
      el.classList.toggle("off", gestures.length > 0);
      const prompts = { topo: "Lay a contour", water: "Lay a rill", plant: "Lay a hedge", path: "Lay a walk", wall: "Lay an edge" };
      const q = el.querySelector(".prompt");
      if (q) q.textContent = prompts[mode] || prompts.topo;
    }

    function flashTracing() {}

    function updateCaption() {
      const tools = document.querySelectorAll("#tools .tool");
      for (let i = 0; i < tools.length; i++) {
        tools[i].classList.toggle("on", tools[i].dataset.mode === mode);
      }
      showEmpty();
    }

    function wireHud() {
      const dock = document.getElementById("dock");
      const toolsEl = document.getElementById("tools");
      function blockP5(evt) {
        evt.stopPropagation();
        evt.preventDefault();
      }
      dock.addEventListener("pointerdown", blockP5);
      dock.addEventListener("mousedown", blockP5);
      const toolBtns = toolsEl.querySelectorAll(".tool");
      for (let i = 0; i < toolBtns.length; i++) {
        toolBtns[i].addEventListener("click", function (evt) {
          evt.stopPropagation();
          setMode(this.dataset.mode);
        });
      }
      const actBtns = dock.querySelectorAll("[data-act]");
      for (let i = 0; i < actBtns.length; i++) {
        actBtns[i].addEventListener("click", function (evt) {
          evt.stopPropagation();
          const act = this.dataset.act;
          if (act === "undo") undoLast();
          else if (act === "clear") clearGestures();
          else if (act === "dark") toggleDark();
          else if (act === "export") exportSheet();
        });
      }
      const alphaSl = document.getElementById("vellum-alpha");
      if (alphaSl) {
        alphaSl.value = String(vellumAlpha);
        alphaSl.addEventListener("pointerdown", function (evt) { evt.stopPropagation(); });
        alphaSl.addEventListener("mousedown", function (evt) { evt.stopPropagation(); });
        alphaSl.addEventListener("click", function (evt) { evt.stopPropagation(); });
        alphaSl.addEventListener("input", function () {
          setVellumAlpha(Number(alphaSl.value), true);
        });
      }
    }

    function layoutLot() {
      const dockW = DOCK_W;
      const m = Math.min(width, height);
      const pad = m * 0.08;
      lot.pad = pad;
      // Even desk margins so the sheet feels centered on the tray
      lot.x = dockW + pad;
      lot.y = pad;
      lot.w = width - lot.x - pad;
      lot.h = height - pad * 2;
      lot.minS = m;
      lot.northX = width - pad * 0.46;
      lot.northY = pad * 0.38;
      lot.scaleX = width - pad * 0.32;
      lot.scaleY = lot.y + lot.h + Math.max(16, pad * 0.32);
    }

    function freeCachedImage(img) {
      // p5's WEBGL renderer keeps a texture per p5.Image in a Map that is never
      // pruned, so every settle bake used to upload a fresh lot-sized texture
      // and leak the previous one — memory and frame time grew all session.
      if (!img) return;
      try {
        const inst = (window.self && window.self.p5) ? window.self.p5.instance : null;
        const r = (inst && inst._renderer) ? inst._renderer : null;
        if (r && r.textures && r.textures.get) {
          const tex = r.textures.get(img);
          if (tex) {
            if (typeof tex.remove === "function") tex.remove();
            r.textures.delete(img);
          }
        }
      } catch (err) {}
    }

    // p5 2's redraw() is async and returns immediately when a draw is already
    // in flight, so a second redraw() in the same tick was silently dropped —
    // a committed stroke could simply never reach the screen. Serialise them
    // and always run one more pass when a request arrived mid-draw.
    let painting = false;
    let paintAgain = false;

    function paintNow() {
      if (painting) { paintAgain = true; return; }
      painting = true;
      let pending = null;
      try { pending = redraw(); } catch (err) { pending = null; }
      Promise.resolve(pending).catch(function () {}).then(function () {
        painting = false;
        if (paintAgain) {
          paintAgain = false;
          requestAnimationFrame(paintNow);
        }
      });
    }

    function remapGestures(from, to) {
      // Gestures are stored in absolute canvas coordinates, so resizing the
      // window used to leave everything sitting where the old lot was — half
      // the sheet ended up outside the property line. Carry the drawing with
      // the lot, uniformly so nothing is squashed.
      if (!gestures.length) return;
      if (!from || !(from.w > 0) || !(from.h > 0)) return;
      if (!(to.w > 0) || !(to.h > 0)) return;
      // Scale by the lot's constraining side, not by a fit-inside min of the
      // two ratios: that is not reversible, so wide -> tall -> wide shrank the
      // drawing every time instead of returning it to its own size.
      const s = Math.min(to.w, to.h) / Math.min(from.w, from.h);
      if (!isFinite(s) || s <= 0) return;
      const fcx = from.x + from.w / 2;
      const fcy = from.y + from.h / 2;
      const tcx = to.x + to.w / 2;
      const tcy = to.y + to.h / 2;
      const mapX = function (x) { return tcx + (x - fcx) * s; };
      const mapY = function (y) { return tcy + (y - fcy) * s; };
      const mapList = function (list) {
        if (!list) return;
        for (let i = 0; i < list.length; i++) {
          const nx = mapX(list[i][0]);
          const ny = mapY(list[i][1]);
          list[i][0] = nx;
          list[i][1] = ny;
        }
      };
      for (let i = 0; i < gestures.length; i++) {
        const g = gestures[i];
        mapList(g.pts);
        mapList(g.handSrc);
        // stampHand aliases hand to handSrc for one-point gestures
        if (g.hand !== g.handSrc) mapList(g.hand);
        mapList(g.joints);
        if (g.clumps) {
          for (let c = 0; c < g.clumps.length; c++) {
            const cl = g.clumps[c];
            const nx = mapX(cl.x);
            const ny = mapY(cl.y);
            cl.x = nx;
            cl.y = ny;
            cl.r *= s;
          }
        }
        if (g.corners) {
          for (let c = 0; c < g.corners.length; c++) {
            const co = g.corners[c];
            const nx = mapX(co.x);
            const ny = mapY(co.y);
            co.x = nx;
            co.y = ny;
          }
        }
        if (g.x != null) g.x = mapX(g.x);
        if (g.y != null) g.y = mapY(g.y);
        if (g.r != null) g.r *= s;
        if (g.halfW != null) g.halfW *= s;
        if (g.spacing != null) g.spacing *= s;
      }
    }

    function invalidateSheetCache() {
      freeCachedImage(sheetCache);
      sheetCache = null;
      bakedUpTo = 0;
    }

    function markSheetChanged() {
      sheetRev += 1;
    }

    function requestAnalog() {
      analogDirty = true;
      invalidateSheetCache();
      paintNow();
    }

    function armSettle() {
      if (drawing || mouseIsPressed) return;
      // p5 listens on window, so a pass over the dock would otherwise arm a
      // full analog retrace and park the hand glyph under the tray.
      if (!overSheet()) return;
      hasPtr = true;
      if (settleTimer) clearTimeout(settleTimer);
      settleTimer = setTimeout(function () {
        settleTimer = null;
        const now = millis();
        // Throttle full analog settle; between that just blit cache + glyph
        // Retrace the analog pass once per change. Without this, simply moving
        // the cursor over the sheet re-brushed every gesture every 1.5s forever.
        // Replaying every stroke costs ~60ms per gesture, so a busy sheet would
        // freeze for seconds on each settle. Past ANALOG_MAX the sheet keeps the
        // jitter it was committed with instead of retracing.
        if (sheetRev !== settledRev && gestures.length <= ANALOG_MAX &&
            now - lastSettleAnalog >= SETTLE_ANALOG_MIN) {
          lastSettleAnalog = now;
          settledRev = sheetRev;
          requestAnalog();
        } else {
          paintNow();
        }
      }, SETTLE_MS);
    }

    function setup() {
      // NEVER call setAttributes — p5 2 throws
      // TypeError: _renderer._setAttributes is not a function
      // and the canvas stays 100x100 blank. This vendor already
      // defaults preserveDrawingBuffer to true.
      createCanvas(windowWidth, windowHeight, WEBGL);
      pixelDensity(1);
      angleMode(DEGREES);
      if (!brushesScaled) {
        brush.scaleBrushes(5);
        brushesScaled = true;
      }
      if (typeof brush.load === "function") brush.load();
      const box = brush.box();
      B.HB = pickBrush(box, ["HB", "2B", "pen"]);
      B.charcoal = pickBrush(box, ["charcoal", "2B", "HB"]);
      B.hatch = pickBrush(box, ["2H", "HB", "cpencil"]);
      B.crayon = pickBrush(box, ["crayon", "pastel", "charcoal"]);
      B.pastel = pickBrush(box, ["pastel", "crayon", "charcoal"]);
      B.H2 = pickBrush(box, ["2H", "HB", "cpencil"]);
      B.B2 = pickBrush(box, ["2B", "HB", "charcoal"]);
      B.rotring = pickBrush(box, ["rotring", "pen", "HB"]);
      B.cpencil = pickBrush(box, ["cpencil", "2H", "HB"]);
      B.pen = pickBrush(box, ["pen", "rotring", "HB"]);
      B.marker = pickBrush(box, ["marker", "rotring", "HB", "pen"]);
      layoutLot();
      noLoop();
      cursor(CROSS);
      wireHud();
      updateCaption();
      const cnv = document.querySelector("canvas");
      if (cnv) {
        function onCnvDown(e) {
          const btn = e.button != null ? e.button : 0;
          // Pan: middle button, secondary, or Space+primary
          if (!drawing && (btn === 1 || btn === 2 || (btn === 0 && spaceHeld))) {
            panning = true;
            panLastX = mouseX;
            panLastY = mouseY;
            if (e.preventDefault) e.preventDefault();
            if (e.pointerId != null && cnv.setPointerCapture) {
              try { cnv.setPointerCapture(e.pointerId); } catch (err) {}
            }
            return;
          }
          if (btn !== 0) return;
          const xy = canvasXY(e);
          if (!drawing && onDesk(xy[0], xy[1])) {
            deskLift = true;
            invalidateSheetCache();
            paintNow();
            return;
          }
          if (beginStroke(e) && e.pointerId != null && cnv.setPointerCapture) {
            try { cnv.setPointerCapture(e.pointerId); } catch (err) {}
          }
        }
        function onCnvMove(e) {
          if (panning) {
            const dx = mouseX - panLastX;
            const dy = mouseY - panLastY;
            panLastX = mouseX;
            panLastY = mouseY;
            viewPanX += dx;
            viewPanY += dy;
            paintNow();
            return;
          }
          if (!drawing) return;
          samplePointer(e);
        }
        function onCnvUp(e) {
          if (panning) {
            panning = false;
            if (e.pointerId != null && cnv.releasePointerCapture) {
              try { cnv.releasePointerCapture(e.pointerId); } catch (err) {}
            }
            paintNow();
            return;
          }
          if (deskLift) {
            deskLift = false;
            invalidateSheetCache();
            paintNow();
          }
          if (!drawing) return;
          endStroke(e);
          if (e.pointerId != null && cnv.releasePointerCapture) {
            try { cnv.releasePointerCapture(e.pointerId); } catch (err) {}
          }
        }
        if (typeof window.PointerEvent === "function") {
          cnv.addEventListener("pointerdown", onCnvDown, true);
          cnv.addEventListener("pointermove", onCnvMove, true);
          cnv.addEventListener("pointerup", onCnvUp, true);
          cnv.addEventListener("pointercancel", onCnvUp, true);
        } else {
          cnv.addEventListener("mousedown", onCnvDown, true);
          cnv.addEventListener("mousemove", onCnvMove, true);
          cnv.addEventListener("mouseup", onCnvUp, true);
        }
        cnv.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
        cnv.addEventListener("auxclick", function (e) { if (e.button === 1) e.preventDefault(); }, true);
      }
      registerYardWebMCP();
    }

    function windowResized() {
      const prevLot = { x: lot.x, y: lot.y, w: lot.w, h: lot.h };
      resizeCanvas(windowWidth, windowHeight);
      // p5.brush sizes its blend source framebuffer in load(). Without a reload
      // it keeps the old canvas dimensions after a resize and the composite
      // pass writes stale blocks of the previous sheet back onto the paper.
      if (typeof brush.load === "function") brush.load();
      layoutLot();
      remapGestures(prevLot, lot);
      markSheetChanged();
      requestAnalog();
    }

    function mouseMoved() {
      if (drawing) {
        const wxy = sheetFromScreen(mouseX, mouseY);
        sampleLive(wxy[0], wxy[1]);
      } else armSettle();
    }

    function beginStroke(evt) {
      if (drawing || strokeLock) return false;
      if (livePts && livePts.length) return false;
      if (spaceHeld || panning) return false;
      const xy = worldPointer(evt);
      if (!inLotWorld(xy[0], xy[1])) return false;
      if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }
      // Ensure committed sheet is cached before live drag (no per-frame full redraw)
      if (!sheetCache) {
        paintNow();
      }
      drawing = true;
      suppressExport = true;
      hasPtr = true;
      livePts = [[xy[0], xy[1]]];
      liveT0 = millis();
      lastDragDraw = 0;
      // Do NOT loop() — sampleLive throttles redraw; sheetCache avoids re-brushing history
      paintNow();
      return true;
    }

    function sampleLive(x, y) {
      if (!drawing || !livePts) return;
      if (!inLotWorld(x, y) && livePts.length < 2) return;
      const last = livePts[livePts.length - 1];
      if (dist(x, y, last[0], last[1]) < 0.5 / viewZoom) return;
      livePts.push([x, y]);
      const now = millis();
      if (now - lastDragDraw >= 28) {
        lastDragDraw = now;
        paintNow();
      }
    }

    function samplePointer(evt) {
      if (!drawing || !livePts) return;
      let list = null;
      if (evt && typeof evt.getCoalescedEvents === "function") {
        try { list = evt.getCoalescedEvents(); } catch (err) { list = null; }
      }
      if (list && list.length) {
        for (let i = 0; i < list.length; i++) {
          const xy = worldPointer(list[i]);
          sampleLive(xy[0], xy[1]);
        }
      } else {
        const xy = worldPointer(evt);
        sampleLive(xy[0], xy[1]);
      }
    }

    function endStroke(evt) {
      if (!livePts || !livePts.length) {
        drawing = false;
        noLoop();
        return;
      }
      const pts = livePts.slice();
      drawing = false;
      strokeLock = true;
      suppressExport = true;
      livePts = null;
      if (evt && evt.clientX != null && pts.length) {
        const xy = worldPointer(evt);
        const last = pts[pts.length - 1];
        if (dist(xy[0], xy[1], last[0], last[1]) >= 0.5 / viewZoom) {
          pts.push(xy);
        }
      }
      resetBrush();
      commitLive(pts);
      flashTracing();
      noLoop();
      paintNow();
      armSettle();
      setTimeout(function () { paintNow(); }, 0);
      setTimeout(function () { suppressExport = false; strokeLock = false; }, 120);
    }

    function mousePressed(evt) {
      return;
    }

    function mouseDragged(evt) {
      if (panning) {
        const dx = mouseX - panLastX;
        const dy = mouseY - panLastY;
        panLastX = mouseX;
        panLastY = mouseY;
        viewPanX += dx;
        viewPanY += dy;
        paintNow();
        return false;
      }
      if (drawing) {
        const wxy = sheetFromScreen(mouseX, mouseY);
        sampleLive(wxy[0], wxy[1]);
      }
      return false;
    }

    function mouseReleased(evt) {
      return;
    }

    function touchStarted(evt) {
      return false;
    }
    function touchEnded(evt) {
      return false;
    }
    function touchMoved(evt) {
      if (drawing) {
        const wxy = sheetFromScreen(mouseX, mouseY);
        sampleLive(wxy[0], wxy[1]);
      } else armSettle();
      return false;
    }

    function commitLive(pts) {
      if (!pts || !pts.length) return;
      const beforeCount = gestures.length;
      const len = polyLen(pts);
      let maxDisp = 0;
      const p0 = pts[0];
      for (let i = 0; i < pts.length; i++) {
        maxDisp = Math.max(maxDisp, dist(p0[0], p0[1], pts[i][0], pts[i][1]));
      }
      const isClick = len < 11 || maxDisp < 6;
      const minS = Math.min(width, height);

      if (isClick) {
        if (mode === "plant") {
          const p = pts[pts.length - 1];
          const tree = {
            kind: "tree",
            x: p[0],
            y: p[1],
            r: minS * (0.045 + hash(seedSeq + ":r") * 0.025),
            seed: nextSeed()
          };
          stampHand(tree, [p], false);
          gestures.push(tree);
          if (agentPending) tree.agent = true;
        }
        if (gestures.length !== beforeCount) markSheetChanged();
        showEmpty();
        return;
      }
      if (pts.length < 3) return;

      const copy = pts.map((p) => [p[0], p[1]]);
      const dt = Math.max(16, millis() - liveT0);
      const speed = len / dt;
      const seed = nextSeed();

      if (mode === "topo") {
        const t = constrain((speed - 0.08) / 1.15, 0, 1);
        const spacing = lerp(6.2, 15.5, t);
        const spine = beautify(copy, { rounds: 2, step: Math.max(4, spacing * 0.42), jitter: 0.45, seed: seed });
        const topoG = {
          kind: "topo",
          pts: spine,
          spacing: spacing,
          n: 5,
          downSign: downSignOf(spine),
          seed: seed
        };
        stampHand(topoG, copy, false);
        gestures.push(topoG);
      } else if (mode === "plant") {
        const halfW = minS * 0.019;
        const spine = beautify(copy, { rounds: 2, step: Math.max(5, halfW * 0.32), jitter: 0.55, seed: seed });
        const plantG = {
          kind: "plant",
          pts: spine,
          halfW: halfW,
          clumps: plantClumps(spine, halfW, seed),
          seed: seed
        };
        stampHand(plantG, copy, false);
        gestures.push(plantG);
      } else if (mode === "path") {
        const halfW = minS * 0.018;
        // Smooth finish: denser sample + more Chaikin, light jitter (no hard corners)
        const dens = densify(copy, halfW * 0.32, false);
        const spine = beautify(dens, { rounds: 4, step: Math.max(3, halfW * 0.28), jitter: 0.16, seed: seed });
        const pathG = {
          kind: "path",
          pts: spine,
          halfW: halfW,
          joints: resample(spine, halfW * 2.6, false),
          seed: seed
        };
        stampHand(pathG, copy, false);
        gestures.push(pathG);
      } else if (mode === "water") {
        const gap = dist(copy[0][0], copy[0][1], copy[copy.length - 1][0], copy[copy.length - 1][1]);
        const bb = bboxOf(copy);
        const area = Math.max(1, bb.w * bb.h);
        const enclosed = Math.abs(shoelace(copy)) / area;
        // Ends must come back near each other relative to how far the stroke
        // travelled. A bare arc encloses plenty of bbox area but never returns,
        // so area alone used to turn every curved rill into a pool.
        const gapRel = gap / Math.max(1, len);
        // A stroke that runs out and doubles back also returns to its start,
        // so a basin has to enclose something too.
        const holdsWater = bb.w > minS * 0.03 && bb.h > minS * 0.03 && enclosed > 0.12;
        const closed = len > minS * 0.14 && gapRel < 0.30 && holdsWater &&
          (gap < minS * 0.09 || enclosed > 0.42);
        if (closed) {
          const basin = fittedBasin(copy, seed);
          const basinG = {
            kind: "water",
            pts: basin.pts,
            rill: false,
            boxy: basin.boxy,
            seed: seed
          };
          stampHand(basinG, copy, true);
          gestures.push(basinG);
        } else {
          const rillG = {
            kind: "water",
            pts: beautify(copy, { rounds: 2, step: 6, jitter: 0.45, seed: seed }),
            rill: true,
            halfW: minS * 0.022,
            seed: seed
          };
          stampHand(rillG, copy, false);
          gestures.push(rillG);
        }
      } else if (mode === "wall") {
        // A wall reads as two tight lines in plan. At the old 0.013 it was as
        // wide as the walk and, filled green, indistinguishable from a hedge.
        const halfW = minS * 0.0062;
        const boxy = isBoxy(copy);
        let spine;
        let closed = false;
        if (boxy) {
          spine = squareToBbox(copy, seed);
          closed = true;
        } else {
          const dens = densify(copy, halfW * 0.5, false);
          spine = beautify(dens, { rounds: 2, step: Math.max(4, halfW * 0.45), jitter: 0.45, seed: seed });
        }
        const wallG = {
          kind: "wall",
          pts: spine,
          halfW: halfW,
          closed: closed,
          boxy: boxy,
          corners: findCorners(spine, closed),
          seed: seed
        };
        stampHand(wallG, copy, closed);
        gestures.push(wallG);
      }
      if (agentPending) {
        for (let i = beforeCount; i < gestures.length; i++) gestures[i].agent = true;
      }
      if (gestures.length !== beforeCount) markSheetChanged();
      showEmpty();
    }

    function keyPressed() {
      if (key === " " || keyCode === 32) { spaceHeld = true; return false; }
      const k = (key || "").toLowerCase();
      if (k === "v") {
        if (drawing) return;
        vellumKey = true;
        invalidateSheetCache();
        paintNow();
        return false;
      }
      if (drawing && k !== "e") return;
      if (k === "t" || k === "h") setMode("topo");
      else if (k === "w") setMode("water");
      else if (k === "p" || k === "m") setMode("plant");
      else if (k === "r" || k === "f") setMode("path");
      else if (k === "l") setMode("wall");
      else if (k === "d") toggleDark();
      else if (k === "e") {
        if (drawing || suppressExport) return;
        exportSheet();
      }
      else if (k === "z") undoLast();
      else if (k === "c" || keyCode === BACKSPACE || keyCode === DELETE) {
        clearGestures();
        return false;
      }
    }

    function keyReleased() {
      if (key === " " || keyCode === 32) { spaceHeld = false; if (panning) { panning = false; paintNow(); } return false; }
      const k = (key || "").toLowerCase();
      if (k === "v") {
        vellumKey = false;
        invalidateSheetCache();
        paintNow();
        return false;
      }
    }

    function blitWorldCache() {
      if (!sheetCache) return false;
      push();
      imageMode(CORNER);
      // Lot-sized identity bake; applyWorldView scales/pans the rice paper only
      image(sheetCache, lot.x, lot.y, lot.w, lot.h);
      pop();
      return true;
    }

    function bakeWorldCache(incremental) {
      // Bake ink only at zoom=1 — no tray/paper (keeps alpha so dots show through yellow)
      // `incremental`: keep the strokes already in the cache and ink only the
      // gestures added since. Laying a stroke used to re-brush the whole sheet,
      // so every new mark got slower than the last.
      const append = !!(incremental && sheetCache && gestures.length > bakedUpTo);
      const hz = viewZoom;
      const hx = viewPanX;
      const hy = viewPanY;
      viewZoom = 1;
      viewPanX = 0;
      viewPanY = 0;
      try {
        push();
        resetMatrix();
        translate(-width / 2, -height / 2);
        clear();
        resetBrush();
        bakingWorld = true;
        if (append) {
          // The blit restores the opaque sheet the new strokes composite onto
          blitWorldCache();
          resetBrush();
          drawGestureRange(bakedUpTo);
        } else {
          drawInkLayers();
        }
        bakingWorld = false;
        flushBrushMarks();
        pop();
        resetBrush();
        const fresh = get(lot.x, lot.y, lot.w, lot.h);
        freeCachedImage(sheetCache);
        sheetCache = fresh;
        bakedUpTo = gestures.length;
      } catch (err) {
        if (window.console && console.warn) console.warn("[Yard Draft] bake failed", err);
        freeCachedImage(sheetCache);
        sheetCache = null;
        bakedUpTo = 0;
      }
      viewZoom = hz;
      viewPanX = hx;
      viewPanY = hy;
    }

    function buildDotLayer() {
      // The desk lattice is thousands of dots. Drawn live it cost thousands of
      // WEBGL draw calls per frame; it only changes on resize or tone, so bake
      // it once into a 2D layer and blit that.
      if (dotLayer) {
        freeCachedImage(dotLayer);
        if (typeof dotLayer.remove === "function") dotLayer.remove();
        dotLayer = null;
      }
      const g = createGraphics(Math.max(1, Math.round(width)), Math.max(1, Math.round(height)));
      g.pixelDensity(1);
      g.clear();
      g.noStroke();
      const ink = g.color(pal("ink"));
      ink.setAlpha(dark ? 56 : 51); // ~0.20–0.22
      g.fill(ink);
      const x0 = DOCK_W + 8;
      for (let x = x0; x < width; x += DOT_STEP) {
        for (let y = 10; y < height; y += DOT_STEP) {
          g.circle(x, y, 1.35);
        }
      }
      dotLayer = g;
      dotLayerKey = dotKey();
    }

    function dotKey() {
      return Math.round(width) + "x" + Math.round(height) + ":" + (dark ? 1 : 0);
    }

    function drawDotGrid() {
      // Desk black dots. Show through translucent yellow paper.
      if (!dotLayer || dotLayerKey !== dotKey()) buildDotLayer();
      if (!dotLayer) return;
      push();
      imageMode(CORNER);
      image(dotLayer, 0, 0, width, height);
      pop();
    }

    function drawGestureRange(start) {
      for (let i = start; i < gestures.length; i++) {
        const hg = gestures[i];
        if (hg.agent) {
          push();
          drawingContext.globalAlpha *= 0.78;
          drawHandLayer(hg);
          pop();
        } else drawHandLayer(hg);
      }
      if (!vellumLifted()) {
        for (let i = start; i < gestures.length; i++) {
          const rg = gestures[i];
          if (rg.agent) {
            push();
            drawingContext.globalAlpha *= 0.78;
            renderGesture(rg);
            pop();
          } else renderGesture(rg);
        }
      }
    }

    function drawInkLayers() {
      // Opaque sheet + lot ticks + gestures — the whole thing bakes together
      drawLotBackdrop();
      drawLot();
      drawGestureRange(0);
    }

    function drawWorldSheet() {
      drawInkLayers();
      if (!bakingWorld) drawLotBorder();
    }

    function composeViewport(extraWorld) {
      // dots → translucent yellow → ink blit → dashed border → HUD
      background(pal("tray"));
      push();
      translate(-width / 2, -height / 2);
      push();
      applyWorldView();
      if (!blitWorldCache()) {
        resetBrush();
        drawInkLayers();
      }
      drawLotBorder();
      if (extraWorld) extraWorld();
      pop();
      drawDotGrid();
      drawNorthScale();
      pop();
      resetBrush();
    }

    function drawCommittedSheet() {
      // Full rebuild path (cache miss): world at identity then bake
      push();
      applyWorldView();
      drawWorldSheet();
      pop();
      drawDotGrid();
      drawNorthScale();
    }

    function draw() {
      if (drawing) {
        const wxy = sheetFromScreen(mouseX, mouseY);
        sampleLive(wxy[0], wxy[1]);
      }
      if (analogDirty) {
        passSeed += 1;
        analogDirty = false;
        refreshHands();
        invalidateSheetCache();
      }
      randomSeed(passSeed);
      noiseSeed(passSeed);

      // Fast path: world cache + live / glyph (zoom/pan never invalidate cache)
      const cacheCurrent = sheetCache && gestures.length <= bakedUpTo;
      if (cacheCurrent && !analogDirty) {
        if (drawing && livePts) {
          composeViewport(function () { drawLivePreview(); });
          return;
        }
        if (!drawing && hasPtr && !(livePts && livePts.length)) {
          composeViewport(function () { drawHandGlyph(); });
          return;
        }
        if (!drawing && !(livePts && livePts.length) && !panning) {
          composeViewport(null);
          return;
        }
        if (panning) {
          composeViewport(null);
          return;
        }
      }

      // Only new gestures since the last bake: ink just those onto the cache
      if (sheetCache && !analogDirty && !drawing && !panning &&
          gestures.length > bakedUpTo && !(livePts && livePts.length) && bakedUpTo > 0) {
        bakeWorldCache(true);
        composeViewport(hasPtr ? function () { drawHandGlyph(); } : null);
        return;
      }

      // Cache miss / settle: full world draw at current view, then bake identity
      background(pal("tray"));
      push();
      translate(-width / 2, -height / 2);
      resetBrush();
      push();
      applyWorldView();
      drawWorldSheet();
      if (livePts && livePts.length) drawLivePreview();
      else if (hasPtr) drawHandGlyph();
      pop();
      drawDotGrid();
      drawNorthScale();
      pop();
      resetBrush();

      if (!drawing && !(livePts && livePts.length) && !panning) {
        bakeWorldCache();
        // Recompose from fresh cache so on-screen matches blit path
        composeViewport(hasPtr ? function () { drawHandGlyph(); } : null);
      }
    }

    function mouseWheel(evt) {
      if (!overSheet()) return true;
      const delta = evt && evt.deltaY != null ? evt.deltaY : 0;
      if (!delta) return false;
      const before = viewZoom;
      const factor = delta > 0 ? 0.92 : 1.08;
      viewZoom = constrain(viewZoom * factor, VIEW_ZMIN, VIEW_ZMAX);
      if (viewZoom === before) return false;
      const c = lotCenter();
      const sx = mouseX;
      const sy = mouseY;
      const wx = (sx - viewPanX - c[0]) / before + c[0];
      const wy = (sy - viewPanY - c[1]) / before + c[1];
      viewPanX = sx - c[0] - (wx - c[0]) * viewZoom;
      viewPanY = sy - c[1] - (wy - c[1]) * viewZoom;
      // Do NOT invalidate world cache — blit only
      paintNow();
      return false;
    }

    function lotBackdropColor() {
      // p5.brush reads the canvas back and treats a transparent pixel as white
      // paper (bgColor = mix(vec3(1.0), source.rgb, source.a)), then writes the
      // result opaque. Ink baked on a cleared canvas therefore burned white
      // holes through soft mask edges. Flatten the paper into a solid colour so
      // the brush always composites onto the tone it will be seen against.
      const tray = color(pal("tray"));
      if (vellumLifted() && !vellumKey) return tray;
      return lerpColor(tray, color(pal("vellum")), Math.min(1, vellumAlpha / 255));
    }

    function drawLotBackdrop() {
      push();
      noStroke();
      rectMode(CORNER);
      fill(lotBackdropColor());
      rect(lot.x, lot.y, lot.w, lot.h);
      noFill();
      pop();
    }

    function drawLivePreview() {
      let col;
      if (mode === "topo") {
        col = lerpColor(color(pal("sepia")), color(pal("ink")), 0.22);
      } else if (mode === "water") {
        col = color(pal("water"));
      } else if (mode === "plant") {
        col = color(pal("olive"));
      } else {
        col = color(pal("ink"));
      }
      col.setAlpha(130);
      stroke(col);
      strokeWeight(2);
      noFill();
      // A drag can hold hundreds of samples — one shape, not one call per segment
      beginShape();
      for (let i = 0; i < livePts.length; i++) vertex(livePts[i][0], livePts[i][1]);
      endShape();
    }

    function dashRect(x, y, w, h, dashLen, gapLen) {
      // Segmented lines — WEBGL has no setLineDash; stays in current world transform
      const edges = [
        [[x, y], [x + w, y]],
        [[x + w, y], [x + w, y + h]],
        [[x + w, y + h], [x, y + h]],
        [[x, y + h], [x, y]]
      ];
      // One LINES shape instead of one draw call per dash
      beginShape(LINES);
      for (let e = 0; e < edges.length; e++) {
        const a = edges[e][0];
        const b = edges[e][1];
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const ux = dx / len;
        const uy = dy / len;
        let pos = 0;
        let draw = true;
        while (pos < len) {
          const seg = Math.min(draw ? dashLen : gapLen, len - pos);
          if (draw) {
            vertex(a[0] + ux * pos, a[1] + uy * pos);
            vertex(a[0] + ux * (pos + seg), a[1] + uy * (pos + seg));
          }
          pos += seg;
          draw = !draw;
        }
      }
      endShape();
    }

    function drawLotBorder() {
      // p5 line() (not brush) — same world matrix as lot fill / vellum; no ghost screen-space frame
      push();
      noFill();
      strokeCap(SQUARE);
      const ink = color(pal("ink"));
      ink.setAlpha(dark ? 120 : 95);
      stroke(ink);
      strokeWeight(1.15);
      dashRect(lot.x, lot.y, lot.w, lot.h, 9, 6.5);
      ink.setAlpha(dark ? 70 : 55);
      stroke(ink);
      strokeWeight(0.85);
      dashRect(lot.x + 0.8, lot.y + 0.8, lot.w - 1.6, lot.h - 1.6, 8, 7);
      pop();
    }

    function drawLot() {
      // Opaque paper plate removed — the sheet tone is drawLotBackdrop (vellumAlpha).
      // Soft under-edge tick marks stay as light ink (drawn with gestures bake path via ink).
      resetBrush();
      analogTooth();
      const x0 = lot.x;
      const y0 = lot.y;
      const x1 = lot.x + lot.w;
      const y1 = lot.y + lot.h;
      brush.set(B.charcoal, pal("ink"), random(0.12, 0.18));
      brush.line(x0 + random(2, 10), y1 + random(0.6, 2.4), x1 + random(-4, 2), y1 + random(0.8, 3.2));
      analogTooth();
      brush.set(B.H2, pal("ink"), random(0.12, 0.16));
      brush.line(x1 + random(0.6, 2.6), y0 + random(6, 14), x1 + random(0.8, 3.0), y1 + random(-3, 2));
      brush.noField();
    }

    function drawNorthScale() {
      // Crisp, judge-readable marks (non-brush). Slight north bias 8–12°.
      // No compass rose, no tip crossbar, no numerals on the scale.
      const L = lot.minS * 0.09;
      const rot = random(8, 12);
      const ux = sin(rot);
      const uy = -cos(rot);
      const nS = 16;
      const lotRight = lot.x + lot.w;
      const lotBot = lot.y + lot.h;
      let tipX = lot.northX;
      let tipY = lot.northY;
      let tailX = tipX - ux * L;
      let tailY = tipY - uy * L;
      const open = 40;
      const arm = 0.36 * L;
      const bx = -ux;
      const by = -uy;
      const oc = cos(open);
      const os = sin(open);
      let a1x = tipX + (bx * oc - by * os) * arm;
      let a1y = tipY + (bx * os + by * oc) * arm;
      let a2x = tipX + (bx * oc + by * os) * arm;
      let a2y = tipY + (-bx * os + by * oc) * arm;
      // Keep arrow+N fully on-canvas (N was clipping the right edge)
      const nW = nS * 0.72;
      const nGap = 10;
      const clearR = 18;
      const minX = Math.min(tipX, tailX, a1x, a2x);
      let dx = 0;
      if (minX < lotRight + clearR) dx = lotRight + clearR - minX;
      let needRight = tipX + nGap + nW + 8;
      if (needRight + dx > width - 6) dx -= (needRight + dx) - (width - 6);
      if (dx) {
        tipX += dx;
        tailX += dx;
        a1x += dx;
        a2x += dx;
      }

      const ink = color(pal("ink"));
      push();
      stroke(ink);
      strokeWeight(1.65);
      strokeCap(ROUND);
      strokeJoin(ROUND);
      noFill();
      line(tailX, tailY, tipX, tipY);
      line(tipX, tipY, a1x, a1y);
      line(tipX, tipY, a2x, a2y);
      // N to the left of the tip when near the right edge; else right of tip, clear of pole
      let nx = tipX + nGap;
      if (nx + nW > width - 6) nx = tipX - nGap - nW;
      const ny = tipY - 2;
      strokeWeight(1.55);
      line(nx, ny, nx, ny - nS);
      line(nx, ny - nS, nx + nW, ny);
      line(nx + nW, ny, nx + nW, ny - nS);
      pop();

      // HUD scale: fixed world length, screen length tracks viewZoom (no CAD numerals)
      const bar = constrain(lot.minS * 0.12 * viewZoom, lot.minS * 0.06, lot.minS * 0.28);
      let rx = lot.scaleX;
      let sy = lot.scaleY;
      if (sy < lotBot + 12) sy = lotBot + 12;
      if (rx < lotRight + 16) rx = Math.min(width - 10, lotRight + 16);
      if (rx > width - 8) rx = width - 8;
      const lx = rx - bar;
      const gap = 3.9;
      const tick = 10;
      const tAng = 18;
      push();
      stroke(ink);
      strokeWeight(1.45);
      strokeCap(ROUND);
      noFill();
      line(lx, sy, rx, sy);
      line(lx, sy + gap, rx, sy + gap);
      line(lx, sy, lx + cos(tAng) * tick, sy - sin(tAng) * tick);
      line(rx, sy, rx - cos(tAng) * tick, sy - sin(tAng) * tick);
      pop();
    }

    const GLYPH = {
      N: [[[0.14, 0.88], [0.14, 0.12], [0.86, 0.88], [0.86, 0.12]]]
    };

    function drawWord(word, x, y, s, col) {
      resetBrush();
      brush.set(B.H2, col, random(0.40, 0.48));
      analogTooth();
      let cx = x;
      for (let i = 0; i < word.length; i++) {
        const paths = GLYPH[word[i]];
        if (paths) {
          for (let p = 0; p < paths.length; p++) {
            const pts = paths[p].map((q) => [cx + q[0] * s, y + q[1] * s]);
            shape(pts, false, 0.08);
          }
        }
        cx += s * 0.82;
      }
      brush.noField();
    }

    function drawHandGlyph() {
      if (!overSheet()) return;
      const x = mouseX;
      const y = mouseY;
      const s = 13;
      resetBrush();
      analogTooth();
      brush.set(B.charcoal, pal("ink"), 0.4);
      brush.line(x - s * 0.32, y, x + s * 0.3, y);
      brush.line(x - s * 0.28, y + s * 0.38, x + s * 0.26, y + s * 0.38);
      brush.line(x - s * 0.32, y, x - s * 0.28, y + s * 0.38);
      brush.line(x + s * 0.3, y, x + s * 0.26, y + s * 0.38);
      brush.line(x - s * 0.18, y, x - s * 0.22, y - s * 0.52);
      brush.line(x + 1, y, x + 1, y - s * 0.68);
      brush.noField();
    }

    function renderGesture(g) {
      randomSeed(passSeed + g.seed);
      if (g.kind === "topo") drawTopoGesture(g);
      else if (g.kind === "water") {
        if (g.rill) drawRillGesture(g);
        else drawWaterGesture(g);
      } else if (g.kind === "plant") drawPlantGesture(g);
      else if (g.kind === "tree") drawTreeGesture(g);
      else if (g.kind === "path") drawPathGesture(g);
      else if (g.kind === "wall") drawWallGesture(g);
    }

    function drawTopoGesture(g) {
      if (!g.pts || g.pts.length < 2) return;
      resetBrush();
      const pts = analogize(g.pts, 0.9, 1, false);
      const mixed = lerpColor(color(pal("sepia")), color(pal("ink")), 0.22);
      const lightSapGrey = "#" + [red(mixed), green(mixed), blue(mixed)].map(function (n) {
        return ("0" + Math.round(n).toString(16)).slice(-2);
      }).join("");
      const n = g.n != null ? g.n : 5;
      const spacing = g.spacing * random(0.97, 1.05);
      const downSign = g.downSign != null ? g.downSign : 1;
      const offsets = {};
      for (let i = -n; i <= n; i++) {
        let off = offsetEdge(pts, i * spacing, false);
        if (!off || off.length < 2) continue;
        const frac = 0.08 * Math.abs(i);
        if (frac > 0) off = trimEnds(off, frac);
        if (!off || off.length < 2 || polyLen(off) < 4) continue;
        offsets[i] = off;
        // Contours are continuous; only the index line is heavier. A dashed
        // contour means "approximate" in survey drawing, so dashing the whole
        // family read as scratch marks instead of terrain.
        const isIndex = (i % 4 === 0);
        analogTooth();
        if (isIndex) {
          brush.set(random() > 0.5 ? B.HB : B.charcoal, lightSapGrey, random(0.72, 0.92));
        } else {
          brush.set(random() > 0.5 ? B.H2 : B.HB, lightSapGrey, random(0.34, 0.46));
        }
        shape(chaikin(jitter(off, 0.65), 1, false), false, 0.18);
      }
      resetBrush();
      analogTooth();
      brush.set(B.HB, pal("sepiaDeep"), random(0.46, 0.62));
      brush.noField();
      for (let i = 1; i <= n; i++) {
        const k = i * downSign;
        const inner = offsets[k - downSign];
        const outer = offsets[k];
        if (!inner || !outer || inner.length < 2) continue;
        const samples = resample(inner, Math.max(14, spacing * 2.2), false);
        for (let s = 1; s < samples.length - 1; s++) {
          if (hash(g.seed + ":g:" + k + ":" + s + ":" + passSeed) > 0.42) continue;
          const p = samples[s];
          const mid = outer[Math.min(outer.length - 1, Math.round(s / (samples.length - 1) * (outer.length - 1)))];
          const dx = mid[0] - p[0];
          const dy = mid[1] - p[1];
